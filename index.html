<script>
'use strict';
const LESSONS=[
 {id:'goals',num:'01',icon:'🎯',title:'Деньги и финансовые цели',summary:'Разберись, чем желания отличаются от потребностей, и научись ставить денежные цели.',time:8,
  intro:'Деньги — это инструмент для достижения целей, а не сама цель. Перед покупкой полезно отличать то, что действительно необходимо, от того, чего просто хочется.',
  points:['Потребность — то, без чего трудно обойтись: еда, безопасность, обучение.','Желание — покупка для удовольствия; она тоже может быть важна, но требует выбора.','Хорошая финансовая цель содержит сумму и срок, например: накопить 30 000 ₸ за 6 месяцев.'],
  example:'Цель 30 000 ₸ за 6 месяцев означает, что нужно откладывать по 5 000 ₸ ежемесячно.',
  quiz:[['Что делает финансовую цель измеримой?',['Фраза «хочу много денег»','Точная сумма и срок','Красивое название','Чужое мнение'],1,'Сумма и срок позволяют составить реальный план.'],['Какая покупка чаще относится к потребности?',['Вода и основные продукты','Третий игровой аксессуар','Случайный сувенир','Дополнительный набор наклеек'],0,'Базовые продукты закрывают жизненную потребность.'],['Какой способ лучше помогает накопить на цель?',['Покупать всё сразу','Ждать случайного подарка','Откладывать часть денег регулярно','Вообще не записывать расходы'],2,'Регулярное накопление делает достижение цели предсказуемее.']]},
 {id:'budget',num:'02',icon:'🧮',title:'Личный и семейный бюджет',summary:'Учись распределять доходы и расходы, сохранять баланс и планировать траты.',time:10,
  intro:'Бюджет — план доходов и расходов за определённый период. Он помогает увидеть, на что уходят деньги, и заранее учитывать обязательные платежи.',
  points:['Доход — деньги, которые поступают в бюджет.','Расход — деньги, которые из бюджета уходят.','Остаток = доходы − расходы. Отрицательный остаток означает дефицит.'],
  example:'Доход 200 000 ₸ и расходы 170 000 ₸ дают остаток 30 000 ₸.',
  quiz:[['Доход 120 000 ₸, расходы 95 000 ₸. Какой остаток?',['15 000 ₸','20 000 ₸','25 000 ₸','35 000 ₸'],2,'120 000 − 95 000 = 25 000 ₸.'],['Что является расходом?',['Заработная плата','Оплата интернета','Полученный подарок деньгами','Проценты по вкладу'],1,'Оплата интернета уменьшает денежный остаток.'],['Что показывает дефицит бюджета?',['Доход больше расходов','Все расходы равны нулю','Расход больше дохода','Накопления растут'],2,'Дефицит возникает, когда расходы превышают доходы.']]},
 {id:'banks',num:'03',icon:'🏦',title:'Банки и депозиты',summary:'Пойми, как работают банковские счета, вклады и проценты.',time:9,
  intro:'Банк помогает хранить деньги и проводить платежи. Депозит — размещение денег в банке на определённых условиях, за которое может начисляться вознаграждение.',
  points:['Изучи ставку, срок, пополнение и условия досрочного снятия.','Номинальная ставка и эффективная годовая ставка могут различаться.','Условия защиты вкладов зависят от страны, банка, валюты и вида продукта.'],
  example:'В учебной задаче 100 000 ₸ под 10% простых годовых за один год дают 10 000 ₸ до возможных удержаний, если условия не менялись.',
  quiz:[['Что важно проверить до открытия депозита?',['Только цвет приложения','Ставку, срок и условия снятия','Только логотип банка','Советы из случайного чата'],1,'Условия вклада определяют доступ к деньгам и ожидаемые начисления.'],['100 000 ₸ под 10% простых годовых за год — сколько процентов?',['1 000 ₸','5 000 ₸','10 000 ₸','20 000 ₸'],2,'100 000 × 0,10 = 10 000 ₸.'],['Почему ставки депозитов нужно сравнивать внимательно?',['Они всегда равны','Условия и правила начислений отличаются','У всех депозитов одинаковый срок','Ставка никогда не меняется'],1,'Различаются сроки, ограничения и способы начисления вознаграждения.']]},
 {id:'credit',num:'04',icon:'🧾',title:'Кредиты и рассрочка',summary:'Узнай, чем заём отличается от собственных денег и почему важна полная стоимость.',time:9,
  intro:'Кредит — заёмные деньги, которые нужно вернуть на согласованных условиях. Даже если ежемесячный платёж кажется небольшим, следует учитывать всю сумму выплат.',
  points:['Основной долг — сумма, полученная в долг.','Дополнительные платежи могут включать проценты, комиссии и другие расходы по договору.','До заключения договора необходимо изучить график платежей и полную стоимость.'],
  example:'Если товар стоит 80 000 ₸, а суммарные платежи по договору равны 92 000 ₸, переплата составляет 12 000 ₸.',
  quiz:[['Товар стоит 80 000 ₸, по договору нужно выплатить 92 000 ₸. Переплата?',['8 000 ₸','10 000 ₸','12 000 ₸','22 000 ₸'],2,'92 000 − 80 000 = 12 000 ₸.'],['Что следует проверить перед кредитным договором?',['Только рекламный слоган','Только размер первого платежа','Полную стоимость и график','Популярность товара'],2,'Полная стоимость показывает общую финансовую нагрузку.'],['Кредитные деньги — это...',['Безвозвратный подарок','Средства, которые нужно вернуть','Доход без обязательств','Вклад под проценты'],1,'Кредит предполагает обязанность возврата согласно договору.']]},
 {id:'reserve',num:'05',icon:'🛟',title:'Финансовая подушка',summary:'Научись создавать резерв на непредвиденные ситуации.',time:8,
  intro:'Финансовая подушка — запас денег на неожиданные необходимые расходы или временную потерю дохода. Размер резерва зависит от обстоятельств семьи.',
  points:['Резерв лучше отделять от денег на повседневные покупки.','Сначала определи необходимые ежемесячные расходы.','Накапливай постепенно и выбирай доступный и подходящий по риску способ хранения.'],
  example:'Если необходимые расходы составляют 150 000 ₸ в месяц, резерв на два таких месяца — 300 000 ₸. Это пример расчёта, не универсальная норма.',
  quiz:[['Для чего в первую очередь нужна финансовая подушка?',['Для спонтанных дорогих покупок','Для непредвиденных необходимых расходов','Для участия в лотерее','Для ежедневных развлечений'],1,'Резерв предназначен для финансовой устойчивости при неожиданностях.'],['Обязательные расходы 100 000 ₸ в месяц. Сколько нужно на резерв в 3 месяца?',['100 000 ₸','200 000 ₸','300 000 ₸','400 000 ₸'],2,'100 000 × 3 = 300 000 ₸.'],['Как лучше относиться к резерву?',['Как к деньгам на любой каприз','Как к отдельному запасу','Как к гарантированной прибыли','Как к чужому долгу'],1,'Отдельный запас помогает не тратить резерв на обычные желания.']]},
 {id:'invest',num:'06',icon:'📈',title:'Акции и облигации',summary:'Изучи основы инвестирования, доходности и риска без настоящих сделок.',time:12,
  intro:'Акция обычно означает долю в компании, а облигация — долговое обязательство эмитента. Инвестиции связаны с риском, а доход не гарантирован.',
  points:['Цена акции может расти и падать; дивиденды не гарантированы.','Облигации могут выплачивать купоны, но сохраняют риск дефолта и изменения цены.','Распределение вложений между разными активами может снизить отдельные риски, но не исключает убытков.'],
  example:'Купив 2 условные акции за 5 000 ₸ каждую, ты потратишь 10 000 ₸. Если цена станет 4 500 ₸, рыночная стоимость снизится до 9 000 ₸.',
  quiz:[['Что обычно означает владение акцией?',['Долю в компании','Гарантию прибыли','Бесплатный кредит','Фиксированную зарплату'],0,'Акция обычно представляет долю участия в компании.'],['Что такое купон облигации?',['Комиссия магазина','Процентная выплата по условиям облигации','Стоимость акции','Налоговый штраф'],1,'Купон — выплата держателю облигации по её условиям.'],['Какое утверждение об инвестициях верно?',['Цена никогда не падает','Прибыль всегда гарантирована','Возможны убытки','Все активы одинаково рискованны'],2,'Стоимость активов может снижаться, а эмитенты могут не исполнить обязательства.']]},
 {id:'pension',num:'07',icon:'🕰️',title:'Накопления на будущее',summary:'Разберись с долгосрочными накоплениями и силой времени.',time:8,
  intro:'Долгосрочное финансовое планирование помогает готовиться к крупным целям и будущим расходам. Пенсионные накопления — один из примеров.',
  points:['Чем раньше начат план, тем больше времени для регулярных пополнений.','Инфляция влияет на покупательную способность накоплений.','Конкретные пенсионные правила и условия зависят от действующего законодательства.'],
  example:'Откладывая 5 000 ₸ в месяц в течение года, без учёта доходности можно накопить 60 000 ₸.',
  quiz:[['Сколько получится за год, если откладывать 5 000 ₸ каждый месяц без процентов?',['30 000 ₸','50 000 ₸','60 000 ₸','75 000 ₸'],2,'5 000 × 12 = 60 000 ₸.'],['Что может уменьшать покупательную способность денег?',['Планирование','Инфляция','Запись расходов','Финансовая цель'],1,'При росте цен на ту же сумму можно купить меньше товаров.'],['Что помогает долгосрочному плану?',['Регулярно пересматривать цели','Игнорировать сроки','Не учитывать расходы','Ожидать гарантированную прибыль'],0,'Пересмотр целей помогает учитывать новые обстоятельства.']]},
 {id:'scams',num:'08',icon:'🔒',title:'Мошенничество и пирамиды',summary:'Научись распознавать опасные обещания и защищать финансовые данные.',time:10,
  intro:'Мошенники часто обещают высокую прибыль почти без риска, торопят с решением и скрывают важные условия. Финансовая безопасность начинается с проверки информации.',
  points:['Не передавай пароли, одноразовые коды и реквизиты доступа.','Не доверяй обещаниям гарантированного высокого дохода.','Сомнительные предложения проверяй через официальные источники и обсуждай со взрослым, которому доверяешь.'],
  example:'Если незнакомец просит назвать SMS-код для «получения приза», код сообщать нельзя.',
  quiz:[['Как поступить, если незнакомец просит SMS-код банка?',['Назвать код сразу','Отправить фото кода','Никому не сообщать код','Опубликовать код'],2,'Одноразовый код может дать доступ к операции или аккаунту.'],['Какой признак должен насторожить?',['Наличие договора','Обещание гарантированного большого дохода без риска','Объяснение рисков','Возможность проверить компанию'],1,'Гарантии высокой прибыли без риска — распространённый тревожный признак.'],['Что делать с подозрительной ссылкой?',['Сразу вводить пароль','Поделиться с друзьями','Проверить адрес через официальный канал','Отправить свои документы'],2,'Официальный канал помогает избежать поддельных страниц.']]},
 {id:'digital',num:'09',icon:'💻',title:'Цифровые платежи и криптоактивы',summary:'Изучи онлайн-платежи, цифровую безопасность и волатильность криптоактивов.',time:10,
  intro:'Цифровые платежи удобны, но требуют защиты данных. Криптоактивы — отдельный класс высокорискованных активов, цены которых могут быстро меняться.',
  points:['Проверяй получателя и сумму до подтверждения перевода.','Защищай устройства паролем и используй надёжную авторизацию.','Не путай криптоактивы с банковским депозитом: они не дают такой же защиты или гарантии стоимости.'],
  example:'В учебном примере цена цифрового актива упала с 10 000 ₸ до 7 000 ₸: снижение составляет 30%.',
  quiz:[['Что стоит проверить перед переводом?',['Получателя и сумму','Только фон приложения','Случайную рекламу','Количество подписчиков'],0,'Проверка получателя и суммы помогает избежать ошибки.'],['Актив стоил 10 000 ₸, стал стоить 7 000 ₸. На сколько процентов упал?',['10%','20%','30%','40%'],2,'Падение 3 000 от 10 000 составляет 30%.'],['Что верно для криптоактивов?',['Их цена всегда стабильна','Они гарантированно приносят прибыль','Они могут резко меняться в цене','Они полностью заменяют резерв'],2,'Криптоактивы могут быть очень волатильными и рискованными.']]}
];
const EXTENDED_COURSE={"goals":{"sections":[{"title":"Откуда берутся деньги и куда они уходят","text":"Доход может быть регулярным — например, оговорённая сумма карманных денег, — или разовым, например денежный подарок. Расходы тоже отличаются: обязательные покрывают реальную необходимость, а необязательные помогают отдыхать или получать удовольствие. Нельзя автоматически считать любой необязательный расход плохим. Важно понимать последствия выбора и не тратить деньги, уже отложенные на обязательные цели.","calculation":"Допустим, у ученика есть 18 000 ₸ карманных денег за месяц: 6 000 ₸ уходят на транспорт, 4 000 ₸ — на питание, 3 000 ₸ — на развлечения. Остаток: 18 000 − 6 000 − 4 000 − 3 000 = 5 000 ₸.","lesson":"Запиши доходы и раздели расходы на «нужно» и «хочу». Обсуди с семьёй, какие траты действительно обязательны."},{"title":"Как поставить измеримую цель","text":"Фраза «хочу новый велосипед» не даёт плана. У конкретной цели есть предмет покупки, итоговая стоимость, срок и сумма регулярного взноса. Сначала проверь, реалистичен ли взнос при текущем бюджете. Если нет — увеличь срок, уменьши стоимость цели или найди законный и безопасный способ получить дополнительный доход вместе со взрослыми.","calculation":"Велосипед стоит условные 84 000 ₸. На накопление есть 7 месяцев. Ежемесячный взнос: 84 000 ÷ 7 = 12 000 ₸. Если доступно 8 000 ₸ в месяц, потребуется 84 000 ÷ 8 000 = 10,5 месяца, то есть 11 полных ежемесячных взносов (в последний месяц достаточно 4 000 ₸).","lesson":"Срок покупки зависит от того, сколько реально можно откладывать, а не от желания купить быстрее."},{"title":"Приоритеты и альтернативная стоимость","text":"При ограниченной сумме покупка одного товара означает отказ от другого. Это и называется альтернативной стоимостью. Сравни не только цену, но и пользу, долговечность и возможность отсрочить покупку. Не следует брать в долг ради необязательной покупки: краткая радость не всегда оправдывает будущие платежи.","calculation":"У тебя 20 000 ₸. Наушники стоят 17 000 ₸, книга — 6 000 ₸. Вместе они стоят 23 000 ₸, поэтому сразу приобрести оба товара не получится. Если взять книгу, останется 14 000 ₸; на наушники будет не хватать 3 000 ₸.","lesson":"Вопрос «от чего я отказываюсь, покупая это?» помогает принять решение без спешки."},{"title":"Как учитывать скидки","text":"Скидка — снижение цены, но это не заработок. Сравни итоговую стоимость с бюджетом и убедись, что покупка действительно нужна. Условие «минус 20%» само по себе не доказывает выгоду: магазин мог первоначально установить высокую цену. Покупка ненужной вещи даже со скидкой остаётся расходом.","calculation":"Товар стоил 25 000 ₸, скидка составляет 20%. Размер скидки: 25 000 × 0,20 = 5 000 ₸. Новая цена: 25 000 − 5 000 = 20 000 ₸. Для такой покупки всё равно нужны 20 000 ₸.","lesson":"Сначала реши, нужен ли товар. Только потом сравнивай цены и скидки."}],"quiz":[["Есть 18 000 ₸; транспорт — 6 000 ₸, питание — 4 000 ₸, развлечения — 3 000 ₸. Каков остаток?",["3 000 ₸","5 000 ₸","7 000 ₸","9 000 ₸"],1,"18 000 − 6 000 − 4 000 − 3 000 = 5 000 ₸."],["Цель — накопить 84 000 ₸ за 7 месяцев без доходности. Сколько откладывать ежемесячно?",["7 000 ₸","10 000 ₸","12 000 ₸","14 000 ₸"],2,"84 000 ÷ 7 = 12 000 ₸ в месяц."],["Накоплено 20 000 ₸. Наушники — 17 000 ₸, книга — 6 000 ₸. Сколько не хватает для покупки обоих товаров?",["1 000 ₸","2 000 ₸","3 000 ₸","4 000 ₸"],2,"17 000 + 6 000 − 20 000 = 3 000 ₸."],["Товар стоит 25 000 ₸, скидка 20%. Сколько стоит товар после скидки?",["18 000 ₸","19 000 ₸","20 000 ₸","22 000 ₸"],2,"25 000 × (1 − 0,20) = 20 000 ₸."],["Что лучше сделать перед спонтанной покупкой за 15 000 ₸?",["Сверить цену с личными целями и бюджетом","Сразу взять деньги в долг","Игнорировать обязательные расходы","Покупать, потому что товар у знакомых"],0,"Сравнение с бюджетом и приоритетами помогает оценить последствия покупки."],["При накоплении 8 000 ₸ в месяц сколько полных месяцев нужно, чтобы собрать не менее 84 000 ₸ без доходности?",["9","10","11","12"],2,"10 × 8 000 = 80 000 ₸, этого мало; 11 × 8 000 = 88 000 ₸."],["Что означает альтернативная стоимость выбора?",["Дополнительную банковскую комиссию","Самую дешёвую цену","Цену рекламы товара","Возможность, от которой приходится отказаться"],3,"Когда ресурсы ограничены, выбор одной покупки исключает другую альтернативу."]]},"budget":{"sections":[{"title":"Три этапа семейного бюджета","text":"Сначала запиши все предполагаемые поступления, затем обязательные расходы: жильё, продукты, коммунальные услуги, транспорт, связь и другие регулярные потребности. После этого распредели доступный остаток между накоплениями и необязательными тратами. Для ребёнка семейный бюджет — модель: реальные семейные цифры можно не раскрывать. Для учёбы достаточно придуманных данных.","calculation":"Пример семьи: зарплата 360 000 ₸ и дополнительный доход 40 000 ₸. Всего: 400 000 ₸. Жильё 140 000 ₸, еда 110 000 ₸, транспорт 35 000 ₸, коммунальные 25 000 ₸. Обязательные расходы: 310 000 ₸, свободно до прочих расходов: 90 000 ₸.","lesson":"Остаток — это не то же самое, что сбережения: часть остатка может потребоваться на другие траты."},{"title":"План и факт: зачем сравнивать","text":"Планируемые траты почти никогда не совпадают с фактическими полностью. Поэтому полезно записывать крупные категории и в конце недели или месяца искать разницу. Если на продукты потратили больше плана, важно сначала выяснить причину — рост цен, гостей, покупку запасов — а не обвинять членов семьи.","calculation":"На еду запланировано 95 000 ₸, фактически потрачено 104 000 ₸. Перерасход: 104 000 − 95 000 = 9 000 ₸. Если доход семьи 400 000 ₸ и остальные расходы не изменились, остаток сократится ровно на 9 000 ₸.","lesson":"Разница «факт минус план» показывает, что нужно скорректировать в следующем периоде."},{"title":"Проценты от дохода и резерв","text":"Доли помогают увидеть структуру расходов. Доля категории = расход по категории ÷ доход × 100%. Универсальной идеальной пропорции для всех семей нет: расходы зависят от числа членов семьи, города, здоровья и обязательств. Резерв на неожиданности и накопления на цель лучше показывать отдельными строками бюджета.","calculation":"При доходе 400 000 ₸ и трате на жильё 140 000 ₸ доля жилья = 140 000 ÷ 400 000 × 100% = 35%. Если семья откладывает 40 000 ₸, доля накоплений = 10%.","lesson":"Не копируй чужой процент расходов без учёта обстоятельств собственной семьи."},{"title":"Что происходит при непредвиденном расходе","text":"Бюджет нужен не только в спокойный месяц. В тренажёре можно добавить неожиданный расход и посмотреть, появится ли дефицит. Если денег не хватает, сперва пересматривают необязательные траты, затем обсуждают решения с семьёй. Для учебной модели не нужны настоящие персональные сведения или сведения о доходах родителей.","calculation":"Доход 400 000 ₸, обычные расходы 350 000 ₸, остаток 50 000 ₸. Неожиданный ремонт 75 000 ₸ увеличивает расходы до 425 000 ₸. Итог: 400 000 − 425 000 = −25 000 ₸ — дефицит.","lesson":"Отрицательный остаток означает, что запланированных поступлений недостаточно."}],"quiz":[["Семья получает 360 000 ₸ и ещё 40 000 ₸. Каков общий месячный доход?",["360 000 ₸","380 000 ₸","400 000 ₸","440 000 ₸"],2,"360 000 + 40 000 = 400 000 ₸."],["Обязательные расходы: 140 000 ₸, 110 000 ₸, 35 000 ₸ и 25 000 ₸. Сколько всего?",["300 000 ₸","310 000 ₸","320 000 ₸","330 000 ₸"],1,"140 000 + 110 000 + 35 000 + 25 000 = 310 000 ₸."],["Доход 400 000 ₸, расходы 310 000 ₸. Сколько осталось до других трат?",["70 000 ₸","80 000 ₸","90 000 ₸","100 000 ₸"],2,"400 000 − 310 000 = 90 000 ₸."],["На продукты планировали 95 000 ₸, потратили 104 000 ₸. Каков перерасход?",["7 000 ₸","8 000 ₸","9 000 ₸","10 000 ₸"],2,"104 000 − 95 000 = 9 000 ₸."],["Жильё обходится в 140 000 ₸ при доходе 400 000 ₸. Какова доля жилья?",["25%","30%","35%","40%"],2,"140 000 ÷ 400 000 × 100% = 35%."],["Доход 400 000 ₸, обычные расходы 350 000 ₸, незапланированный ремонт 75 000 ₸. Итог?",["Остаток 25 000 ₸","Дефицит 25 000 ₸","Остаток 50 000 ₸","Дефицит 75 000 ₸"],1,"400 000 − 350 000 − 75 000 = −25 000 ₸."],["Зачем сравнивать план расходов с фактом?",["Чтобы узнать, где возникли отклонения и изменить план","Чтобы отказаться от учёта доходов","Чтобы всегда тратить всю зарплату","Чтобы скрывать обязательные платежи"],0,"Сравнение выявляет перерасход и помогает скорректировать бюджет."]]},"banks":{"sections":[{"title":"Счёт, карта и депозит — не одно и то же","text":"Банковский счёт нужен для учёта денег и переводов, карта помогает получить доступ к деньгам на счёте, а депозит оформляется на условиях банковского вклада. У разных продуктов могут отличаться доступность денег, начисление вознаграждения и ограничения. Важно читать договор и тарифы, а не считать, что любая цифра «процентов» означает одинаковый результат.","calculation":"Условный пример: на текущем счёте 80 000 ₸, на депозите 120 000 ₸. Суммарно у человека 200 000 ₸ в этих двух продуктах. Но снять деньги с вклада можно только по условиям конкретного договора.","lesson":"Платёжная карта — инструмент доступа к счёту; сама по себе карта не заменяет вклад."},{"title":"Простой процент и капитализация","text":"Для простых процентов в учебном примере доход = сумма × годовая ставка × время в годах. При капитализации начисленное вознаграждение добавляют к сумме, поэтому в следующий период процент может начисляться на увеличенную базу. На практике банки используют условия договора, особенности начисления, номинальные и эффективные ставки; упрощённые формулы не являются банковским расчётом.","calculation":"Без капитализации: 100 000 ₸ × 12% = 12 000 ₸ за 1 год; итог 112 000 ₸. С ежегодной капитализацией по условной ставке 10%: через 2 года 100 000 × 1,1 × 1,1 = 121 000 ₸. Вознаграждение — 21 000 ₸.","lesson":"Не путай ставку «10% за год» с «10% каждый месяц»: это совершенно разные условия."},{"title":"Сравниваем условия, а не рекламный баннер","text":"При сравнении вкладов выясни, можно ли пополнять, когда разрешено снимать средства, изменяется ли ставка и какая указана годовая эффективная ставка вознаграждения (ГЭСВ). Пример сравнения должен учитывать одинаковые сроки, суммы, пополнения и способ начисления. Условия конкретного банка могут изменяться, поэтому не ориентируйся на числа учебной задачи как на рыночные предложения.","calculation":"В учебной задаче 200 000 ₸ на один год при простых 9% дают 18 000 ₸, а при простых 11% — 22 000 ₸. Разница 4 000 ₸. Однако этот расчёт не учитывает различий в снятии денег и капитализации.","lesson":"Ставка — только один из критериев. Удобство доступа и правила досрочного снятия тоже важны."},{"title":"Как защищены вклады в Казахстане","text":"Казахстанский фонд гарантирования депозитов (КФГД) защищает подходящие счета и вклады в банках-участниках в установленных пределах. По опубликованным правилам на ноябрь 2026 года: для сберегательных вкладов в тенге предел составляет 20 млн ₸, для иных вкладов и счетов в тенге — 10 млн ₸, для вкладов в иностранной валюте — эквивалент 5 млн ₸. При нескольких вкладах в одном банке действуют также общие ограничения и правила суммирования. Эти лимиты не относятся к вымышленным инвестициям в нашем тренажёре.","calculation":"Если в примере у человека один обычный депозит в тенге на 11 000 000 ₸ в одном банке-участнике, предельная гарантия по этому типу — 10 000 000 ₸; оставшийся 1 000 000 ₸ выходит за этот предел. Это пример предела, а не прогноз выплаты по реальному делу.","lesson":"Проверь актуальные условия на kdif.kz; страхование вклада не означает страховку акций и криптоактивов."}],"quiz":[["Есть 80 000 ₸ на счёте и 120 000 ₸ на вкладе. Какова сумма денег в обоих продуктах?",["160 000 ₸","180 000 ₸","200 000 ₸","220 000 ₸"],2,"80 000 + 120 000 = 200 000 ₸."],["На 200 000 ₸ начисляют 9% простых годовых за один год. Сколько процентов?",["9 000 ₸","16 000 ₸","18 000 ₸","20 000 ₸"],2,"200 000 × 0,09 = 18 000 ₸."],["100 000 ₸ под условные 10% годовых с ежегодной капитализацией на 2 года. Какова итоговая сумма?",["110 000 ₸","120 000 ₸","121 000 ₸","122 000 ₸"],2,"100 000 × 1,1² = 121 000 ₸."],["Какое утверждение о банковской карте верно?",["Карта — способ доступа к банковскому счёту","Карта всегда является отдельным вкладом","Любая карта платит одинаковый процент","У карты не бывает тарифов"],0,"Платёжная карта позволяет распоряжаться средствами на связанном с ней счёте."],["Что важно сравнить у двух депозитов помимо ставки?",["Цвет карточки","Правила снятия, пополнения и срок","Число рекламных роликов","Дизайн сайта"],1,"Доступ к деньгам и условия вклада могут менять удобство и фактический результат."],["По правилам КФГД на ноябрь 2026 года каков максимум гарантии по одному обычному вкладу в тенге (не сберегательному)?",["5 млн ₸","10 млн ₸","15 млн ₸","20 млн ₸"],1,"Для иных вкладов в тенге предел — 10 млн ₸. Отдельные условия суммирования проверяются на kdif.kz."],["Почему расчёт простого годового процента в учебнике нельзя считать точным банковским прогнозом?",["Потому что он всегда занижает доход","Потому что реальные договоры задают порядок начисления и ограничения","Потому что банки не начисляют вознаграждение","Потому что каждый вклад обязательно рискованнее акции"],1,"Сроки начисления, капитализация, условия снятия и действующие тарифы влияют на итог."]]},"credit":{"sections":[{"title":"Что означает заём","text":"Кредит — обязательство вернуть полученные деньги по договору. При рассрочке платят частями, но нужно проверить, действительно ли сумма платежей равна цене товара, нет ли дополнительных услуг, сборов или страховок. Для школьников этот раздел — практика понимания договоров, а не предложение брать кредит. Финансовые решения в семье обсуждаются со взрослыми.","calculation":"В учебной рассрочке ноутбук стоит 240 000 ₸, оплата равными частями в течение 12 месяцев, без комиссий и процентов. Ежемесячный платёж: 240 000 ÷ 12 = 20 000 ₸, итог 240 000 ₸. Если обязательные дополнительные платежи составят 12 000 ₸, итог уже 252 000 ₸.","lesson":"Слово «рассрочка» не гарантирует отсутствие дополнительных расходов."},{"title":"Полная сумма выплат и переплата","text":"Переплата в упрощённом примере = сумма всех обязательных платежей − первоначальная стоимость покупки или полученная сумма займа (в зависимости от условия задачи). Нельзя оценивать кредит по одному ежемесячному платежу: длинный срок делает платёж меньше, но может увеличить общую стоимость. В реальности изучают договор, график, ГЭСВ и возможные обязательные расходы.","calculation":"Товар стоит 180 000 ₸. По кредитному графику платёж 18 000 ₸ в месяц на протяжении 12 месяцев. Общая выплата: 18 000 × 12 = 216 000 ₸. Разница с ценой: 216 000 − 180 000 = 36 000 ₸.","lesson":"Сначала посчитай общую выплату за весь срок, только потом смотри на размер платежа."},{"title":"Что такое долговая нагрузка","text":"Долговая нагрузка показывает, какая доля дохода уходит на выплаты по долгам. В учебном задании доля платежей = платежи за месяц ÷ месячный доход × 100%. Этот показатель сам по себе не определяет, доступен ли кредит: учитываются обязательные расходы, финансовый резерв, стабильность доходов и условия договора. Рекомендуемого единого процента для каждой семьи здесь нет.","calculation":"Доход семьи 400 000 ₸, суммарные обязательные платежи по займам 80 000 ₸. Доля платежей составляет 80 000 ÷ 400 000 × 100% = 20%. После выплаты остаётся 320 000 ₸ до остальных расходов.","lesson":"Даже при небольшой доле платежей важен остаток на жизнь и непредвиденные расходы."},{"title":"Просрочка и мошеннические предложения","text":"Просрочка может привести к дополнительным расходам и отрицательно повлиять на кредитную историю. Условия и последствия определяются договором и законом. Если предлагают «мгновенный заём без документов» и просят сначала перечислить деньги неизвестному человеку, это тревожный сигнал. Для подросткового курса достаточно понимать риски и способы проверки, не оформляя реальные займы.","calculation":"В учебной ситуации после уплаты обязательных расходов остаётся 30 000 ₸, а очередной платёж равен 35 000 ₸. Недостаток составляет 35 000 − 30 000 = 5 000 ₸. Значит, план нуждается в пересмотре заранее.","lesson":"Не решай проблемы с долгами новым необдуманным долгом."}],"quiz":[["Ноутбук стоит 240 000 ₸, рассрочка 12 равных платежей без доплат. Сколько в месяц?",["15 000 ₸","18 000 ₸","20 000 ₸","24 000 ₸"],2,"240 000 ÷ 12 = 20 000 ₸."],["К товару за 240 000 ₸ добавили обязательный платёж 12 000 ₸. Какова итоговая сумма?",["240 000 ₸","242 000 ₸","250 000 ₸","252 000 ₸"],3,"240 000 + 12 000 = 252 000 ₸."],["По 18 000 ₸ каждый месяц 12 месяцев. Сколько всего выплатят?",["180 000 ₸","198 000 ₸","216 000 ₸","226 000 ₸"],2,"18 000 × 12 = 216 000 ₸."],["Цена товара — 180 000 ₸, общая сумма платежей — 216 000 ₸. Какова разница?",["18 000 ₸","30 000 ₸","36 000 ₸","42 000 ₸"],2,"216 000 − 180 000 = 36 000 ₸."],["Доход 400 000 ₸, выплаты по займам 80 000 ₸. Какая доля дохода уходит на выплаты?",["10%","15%","20%","25%"],2,"80 000 ÷ 400 000 × 100% = 20%."],["Что верно о рассрочке?",["В ней всегда отсутствуют дополнительные расходы","Условия и итоговую сумму нужно проверять в договоре","Её стоимость всегда равна нулю","Её не нужно включать в бюджет"],1,"Название продукта не заменяет проверку всех обязательных платежей."],["После обязательных расходов осталось 30 000 ₸, платёж по договору 35 000 ₸. Чего не хватает?",["3 000 ₸","4 000 ₸","5 000 ₸","6 000 ₸"],2,"35 000 − 30 000 = 5 000 ₸; текущего остатка недостаточно."]]},"reserve":{"sections":[{"title":"Резерв и накопления на желание","text":"Финансовая подушка предназначена для непредвиденных необходимых расходов, а фонд на желаемую покупку — для заранее известной цели. Эти суммы желательно учитывать раздельно. Если на ремонт срочно требуется помощь, не следует считать покупку приставки одинаково важной с обязательными тратами. Размер подушки определяется индивидуально и зависит от семейных обстоятельств.","calculation":"Условная семья хранит 180 000 ₸ как резерв и отдельно 60 000 ₸ на отпуск. Всего сбережений 240 000 ₸, но резерв — только 180 000 ₸. Использование 50 000 ₸ из резерва уменьшит его до 130 000 ₸.","lesson":"Две цели — два учёта: «на неожиданности» и «на запланированное»."},{"title":"Как рассчитывать месяцы покрытия","text":"Часто размер резерва описывают количеством месяцев необходимых расходов. Это не универсальная норма, а удобный способ сравнения: число месяцев = резерв ÷ обязательные расходы за месяц. При расчёте не стоит включать необязательные покупки. Если обязательные траты изменились, потребность в резерве тоже изменится.","calculation":"Необходимые расходы 120 000 ₸ в месяц. Резерв 360 000 ₸ обеспечивает 360 000 ÷ 120 000 = 3 месяца таких расходов. Если расходы выросли до 150 000 ₸, этот же резерв покроет 360 000 ÷ 150 000 = 2,4 месяца.","lesson":"Резерв оценивают относительно необходимых расходов, а не относительно дохода."},{"title":"Сколько нужно откладывать","text":"Резерв редко создаётся за один день. Определи посильный регулярный взнос и примерный срок. Для простых задач не учитывай проценты, чтобы видеть арифметику накопления. Если возник обязательный расход, можно временно уменьшить взнос: важнее реалистичный план, чем формальное обещание.","calculation":"Цель 240 000 ₸, уже есть 60 000 ₸. Осталось собрать 180 000 ₸. При взносе 15 000 ₸ в месяц потребуется 180 000 ÷ 15 000 = 12 месяцев (без процентов).","lesson":"Путь к резерву состоит из небольших регулярных действий."},{"title":"Ликвидность и безопасность","text":"Ликвидность — насколько быстро можно получить деньги без существенной потери стоимости. Для резерва важнее доступность и надёжность хранения, чем обещание необычно высокого дохода. В модели можно часть денег держать для быстрых расходов, но конкретный способ хранения выбирается с учётом рисков и правил финансовых организаций.","calculation":"Неожиданный необходимый расход — 45 000 ₸, доступные резервные деньги — 50 000 ₸. После оплаты останется 50 000 − 45 000 = 5 000 ₸. Теперь можно запланировать восстановление использованного резерва.","lesson":"Нельзя считать любой инвестиционный актив заменой быстро доступного денежного резерва."}],"quiz":[["Есть резерв 180 000 ₸ и отдельные 60 000 ₸ на отпуск. Сколько составляет именно резерв?",["60 000 ₸","120 000 ₸","180 000 ₸","240 000 ₸"],2,"Деньги на отпуск учитываются отдельно; резерв равен 180 000 ₸."],["Резерв 360 000 ₸, обязательные расходы 120 000 ₸ в месяц. На сколько месяцев его хватит?",["2","3","4","5"],1,"360 000 ÷ 120 000 = 3 месяца."],["Резерв 360 000 ₸, обязательные расходы стали 150 000 ₸. На сколько месяцев хватит?",["2 месяца","2,4 месяца","3 месяца","3,6 месяца"],1,"360 000 ÷ 150 000 = 2,4 месяца."],["Цель резерва 240 000 ₸, уже есть 60 000 ₸. Сколько осталось накопить?",["120 000 ₸","150 000 ₸","180 000 ₸","200 000 ₸"],2,"240 000 − 60 000 = 180 000 ₸."],["Осталось накопить 180 000 ₸, взнос 15 000 ₸ в месяц без процентов. Сколько месяцев потребуется?",["10","11","12","13"],2,"180 000 ÷ 15 000 = 12 месяцев."],["Что в первую очередь важно для хранения денег на экстренный случай?",["Возможность быстро и безопасно использовать нужную сумму","Максимальный риск ради потенциальной прибыли","Сложность доступа к своим средствам","Популярность рекламы"],0,"Непредвиденные расходы требуют доступных и надёжно хранящихся денег."],["Из доступного резерва 50 000 ₸ потратили 45 000 ₸ на необходимый ремонт. Сколько осталось?",["2 500 ₸","5 000 ₸","10 000 ₸","15 000 ₸"],1,"50 000 − 45 000 = 5 000 ₸."]]},"invest":{"sections":[{"title":"Что покупает инвестор","text":"Акция обычно связана с долей участия в компании, облигация — с долговым обязательством эмитента, а инвестиционный фонд объединяет деньги многих инвесторов по определённой стратегии. Эти инструменты различаются по правам, денежным потокам и рискам. Умение объяснить инструмент своими словами важнее запоминания тикеров. В нашем тренажёре все активы вымышлены; реальные брокерские сделки не требуются.","calculation":"Условная акция стоит 8 000 ₸. Покупка 6 штук без комиссий обойдётся в 6 × 8 000 = 48 000 ₸. Это стоимость покупки, а не обещание будущей прибыли.","lesson":"Покупка инвестиционного актива не равна открытию банковского депозита."},{"title":"Доходность и убыток по акциям","text":"Изменение рыночной цены описывают в тенге и процентах. Доходность по изменению цены = (новая цена − цена покупки) ÷ цена покупки × 100%. Убыток возникает, когда цена ниже стоимости покупки; до продажи это изменение оценочной рыночной стоимости. Комиссии, налоги и дивиденды могут изменить фактический результат, поэтому в учебных задачах явно уточняем, что их нет.","calculation":"Купили 4 условные акции по 10 000 ₸: затраты 40 000 ₸. Цена выросла до 11 500 ₸: стоимость 46 000 ₸, прирост 6 000 ₸, то есть 15%. Если цена упала до 9 000 ₸: стоимость 36 000 ₸, изменение −4 000 ₸ или −10%.","lesson":"Рост в прошлом не гарантирует рост в будущем."},{"title":"Купон и риск облигаций","text":"Облигация может выплачивать купоны, однако при продаже до погашения её рыночная цена может оказаться выше или ниже покупки. Кроме этого, эмитент может не исполнить обязательства. Условия выплат и дата погашения записываются в документах выпуска; здесь используется простая модель без реальных бумаг.","calculation":"Вымышленная облигация имеет номинал 20 000 ₸ и учебный годовой купон 8% от номинала. При условии одной выплаты в год купон составляет 20 000 × 0,08 = 1 600 ₸. Пять таких облигаций дают 8 000 ₸ купонов за год, если эмитент выплатит их полностью.","lesson":"Купон — не гарантия отсутствия риска и не то же самое, что рост цены облигации."},{"title":"Распределение и риск портфеля","text":"Диверсификация — распределение между разными активами и источниками риска. Она может снизить зависимость от одной компании, но не защищает от общего падения рынка. Виртуальный портфель показывает, как изменяется суммарная стоимость после покупок, продаж и условных движений цен. Игровые цены заданы сценариями и не служат прогнозом настоящего рынка.","calculation":"В портфеле 300 000 ₸: условные акции 120 000 ₸, облигации 120 000 ₸, деньги 60 000 ₸. Доли составляют 40%, 40% и 20%. Если акции упадут на 25%, а остальные позиции неизменны, портфель потеряет 120 000 × 0,25 = 30 000 ₸ и станет стоить 270 000 ₸.","lesson":"Умеренность в риске и понимание инструмента важнее обещаний «быстрого заработка»."}],"quiz":[["Шесть условных акций стоят по 8 000 ₸. Какова стоимость покупки без комиссий?",["42 000 ₸","46 000 ₸","48 000 ₸","54 000 ₸"],2,"6 × 8 000 = 48 000 ₸."],["Четыре акции куплены по 10 000 ₸, цена стала 11 500 ₸. Каков прирост стоимости без комиссий?",["4 000 ₸","5 000 ₸","6 000 ₸","8 000 ₸"],2,"4 × (11 500 − 10 000) = 6 000 ₸."],["Цена выросла с 10 000 ₸ до 11 500 ₸. Каков рост в процентах?",["10%","12%","15%","20%"],2,"(11 500 − 10 000) ÷ 10 000 × 100% = 15%."],["Облигация: номинал 20 000 ₸, условный годовой купон 8%. Какова выплата по одной бумаге за год?",["800 ₸","1 200 ₸","1 600 ₸","2 000 ₸"],2,"20 000 × 0,08 = 1 600 ₸ при условии полной выплаты эмитентом."],["В портфеле 300 000 ₸, из них 60 000 ₸ — деньги. Какова доля денег?",["10%","15%","20%","25%"],2,"60 000 ÷ 300 000 × 100% = 20%."],["Активы стоимостью 120 000 ₸ подешевели на 25%, остальное в портфеле 180 000 ₸ неизменно. Итог?",["240 000 ₸","250 000 ₸","270 000 ₸","290 000 ₸"],2,"120 000 × 0,75 + 180 000 = 270 000 ₸."],["Что точнее всего описывает диверсификацию?",["Полную защиту от убытков","Покупку только одного эмитента","Распределение средств по разным активам и рискам","Гарантированный рост доходности"],2,"Диверсификация уменьшает зависимость от одной позиции, но не устраняет все риски."]]},"pension":{"sections":[{"title":"Долгосрочные цели и регулярность","text":"У долгосрочной цели важны срок, желаемая сумма и доступный регулярный взнос. Полезно сравнивать несколько сценариев: что будет, если начать раньше или делать небольшие пополнения систематически. Будущая доходность неизвестна, поэтому сначала рассматриваем накопления без процентов. Размер взноса должен оставаться посильным.","calculation":"По 7 500 ₸ в месяц в течение 24 месяцев дают 7 500 × 24 = 180 000 ₸ без учёта доходности. Если начать на год позже, но сохранить общий срок окончания, останется 12 месяцев, и будет накоплено лишь 90 000 ₸.","lesson":"Дисциплина планирования зависит от регулярности, а не от крупных разовых сумм."},{"title":"Что делает инфляция","text":"Инфляция — рост общего уровня цен с течением времени. Она уменьшает количество товаров, которые можно купить на неизменную сумму. Но цены отдельных товаров могут изменяться иначе, чем общий индекс инфляции. Чтобы не путать номинальные и реальные величины, сначала фиксируй, что именно сравниваешь.","calculation":"Корзина продуктов стоила условные 40 000 ₸, через год такая же корзина стоит 44 000 ₸. Рост цены корзины: (44 000 − 40 000) ÷ 40 000 × 100% = 10%. Если денег осталось 40 000 ₸, прежнюю корзину теперь не купить без доплаты 4 000 ₸.","lesson":"Приведённые 10% — ставка из учебной задачи, а не фактическая инфляция Казахстана."},{"title":"Номинальный результат и покупательная способность","text":"Номинальная сумма показывает тенге на счёте. Реальная покупательная способность учитывает изменение цен. В упрощённой модели можно сравнить рост сбережений и стоимости конкретной корзины. Это не точный расчёт инфляции всего рынка, но наглядное упражнение о времени и деньгах.","calculation":"Сбережения выросли с 100 000 до 108 000 ₸ (+8%). Цена выбранной корзины выросла со 100 000 до 112 000 ₸ (+12%). Хотя денег стало на 8 000 ₸ больше, на корзину всё равно не хватает 4 000 ₸.","lesson":"Номинальный рост суммы ещё не означает рост покупательной способности."},{"title":"Пенсионная система Казахстана: базовая логика","text":"В Казахстане долгосрочные пенсионные накопления связаны, в частности, с ЕНПФ — Единым накопительным пенсионным фондом. Порядок взносов, выплат и управления средствами определяется законодательством и может изменяться. В рамках детского урока достаточно понимать назначение пенсионных накоплений и роль долгого горизонта. Это не инструкция по открытию счёта или получению выплат.","calculation":"Если условный человек ежемесячно откладывает 10 000 ₸ в отдельный долгосрочный план на 5 лет без доходности и снятий, арифметическая сумма взносов: 10 000 × 12 × 5 = 600 000 ₸.","lesson":"Пенсионные правила и реальные ставки нельзя выводить из учебных цифр."}],"quiz":[["По 7 500 ₸ в месяц 24 месяца, без процентов. Сколько накопится?",["150 000 ₸","165 000 ₸","180 000 ₸","195 000 ₸"],2,"7 500 × 24 = 180 000 ₸."],["По 7 500 ₸ в месяц 12 месяцев, без процентов. Сколько накопится?",["75 000 ₸","90 000 ₸","105 000 ₸","120 000 ₸"],1,"7 500 × 12 = 90 000 ₸."],["Корзина стоила 40 000 ₸, стала стоить 44 000 ₸. Каков рост цены корзины?",["5%","8%","10%","12%"],2,"4 000 ÷ 40 000 × 100% = 10%."],["Корзина стоит 44 000 ₸, осталось 40 000 ₸. Какой суммы недостаёт?",["2 000 ₸","3 000 ₸","4 000 ₸","5 000 ₸"],2,"44 000 − 40 000 = 4 000 ₸."],["Сбережения выросли до 108 000 ₸, а нужная корзина подорожала до 112 000 ₸. Итог?",["Денег хватает, останется 4 000 ₸","Не хватает 4 000 ₸","Денег хватает ровно","Не хватает 8 000 ₸"],1,"112 000 − 108 000 = 4 000 ₸."],["Что означает «номинальная сумма накоплений»?",["Сумму денег в текущих денежных единицах","Количество товаров по старым ценам","Гарантированный реальный доход","Размер инфляции"],0,"Номинальное значение не корректируется автоматически на изменение цен."],["Какую функцию выполняет ЕНПФ в Казахстане?",["Продаёт все школьные учебники","Участвует в системе пенсионных накоплений","Гарантирует рост любой акции","Устанавливает цены в магазинах"],1,"ЕНПФ относится к системе пенсионных накоплений; правила определяются законом."]]},"scams":{"sections":[{"title":"Почему обещания быстрого дохода опасны","text":"Для финансовой пирамиды характерны выплаты старым участникам преимущественно за счёт денег новых участников, а не устойчивой экономической деятельности. Участникам могут обещать высокий гарантированный доход, требовать приводить друзей или скрывать информацию о деятельности компании. Даже если кто-то получил выплату, это не доказывает безопасность схемы.","calculation":"Допустим, человеку обещают превратить 50 000 ₸ в 75 000 ₸ за месяц. Обещанная прибавка — 25 000 ₸ или 50% за месяц. Такая цифра — повод остановиться и проверить предложение, а не доказательство реальной доходности.","lesson":"Высокая обещанная прибыль без понятного источника денег требует особой осторожности."},{"title":"Мошеннические сообщения и поддельные сайты","text":"Злоумышленник может выдавать себя за банк, службу доставки или знакомого. Сообщение часто содержит срочность, ссылку на подозрительный сайт, просьбу назвать код или данные карты. Даже знакомое имя отправителя не гарантирует подлинность. Безопаснее открывать нужный сервис самостоятельно через официальное приложение или известный адрес, а не по ссылке из сообщения.","calculation":"СМС «Ваша карта заблокирована, назовите код за 60 секунд» — типичный сценарий давления. Правильное действие: не сообщать код, самостоятельно связаться с банком по официальному каналу и при необходимости обсудить ситуацию со взрослым.","lesson":"Не пересылай никому одноразовые коды подтверждения."},{"title":"Как проверить сомнительное предложение","text":"Сначала выясни полное юридическое название организации, условия договора, источник обещаемого дохода и доступность официальной информации. В Казахстане можно сверять публичные разъяснения финансовых регуляторов и сведения об участниках рынка через официальные ресурсы. Наличие красивого сайта или известного лица в рекламе не заменяет проверки.","calculation":"Если у предложения нет понятного договора, но требуется внести 30 000 ₸ и привести двух знакомых, это набор тревожных признаков. Правильная учебная реакция — отказаться от перевода денег и обсудить предложение с надёжным взрослым.","lesson":"Проверка снижает риск, но никакая реклама не заменяет официальных документов."},{"title":"Случайная ошибка: что делать безопасно","text":"Если данные уже переданы или есть подозрение на неправомерную операцию, действовать нужно через официальные каналы банка или платёжного сервиса и вовлечь доверенного взрослого. Не вступай в переписку с неизвестными «специалистами по возврату» и не плати им за обещание вернуть деньги. В этой платформе не нужно вводить персональные данные, пароли или номера карт.","calculation":"В учебном случае неизвестный просит предоплату 5 000 ₸ за «возврат» 20 000 ₸. Такая предоплата не подтверждает возможность возврата. Дальнейшие действия — обращение только в официальные службы, а не ещё один перевод неизвестному лицу.","lesson":"При сомнениях сначала останови операцию и проверь информацию."}],"quiz":[["Предлагают превратить 50 000 ₸ в 75 000 ₸ за один месяц. Какой процент прибыли обещают?",["25%","40%","50%","75%"],2,"(75 000 − 50 000) ÷ 50 000 × 100% = 50%. Обещание не делает доход реальным."],["Что часто характерно для финансовой пирамиды?",["Доход прежде всего от привлечения новых участников","Прозрачная продажа реальных товаров с документами","Отсутствие обещаний доходности","Независимая проверка регулятором"],0,"В пирамидах выплаты старым участникам часто зависят от взносов новых."],["Пришло СМС «Назови код банка за минуту». Что делать?",["Назвать код из-за срочности","Переслать код знакомым","Открыть случайную ссылку","Не передавать код и проверить через официальный канал"],3,"Код подтверждения нельзя передавать посторонним; связь с банком проверяют самостоятельно."],["Почему красивый сайт не доказывает надёжность финансовой компании?",["Потому что дизайн легко создать без законной деятельности","Потому что все сайты запрещены","Потому что сайты не показывают текст","Потому что только бумага гарантирует прибыль"],0,"Внешнее оформление само по себе не подтверждает права и обязанности организации."],["Что должно насторожить в предложении заработать деньги?",["Понятный договор","Сведения о рисках","Требование привести новых вкладчиков ради выплат","Официальная информация о компании"],2,"Зависимость заработка от постоянного вовлечения новых людей — тревожный признак."],["Незнакомец просит 5 000 ₸ предоплаты за «возврат» потерянных 20 000 ₸. Безопасная реакция?",["Перевести аванс сразу","Не платить и обращаться в официальные службы","Передать пароль для ускорения","Попросить друга заплатить"],1,"Неизвестные «возвращатели» могут быть повторными мошенниками."],["Как лучше проверить финансовое предложение в Казахстане?",["По числу лайков","По обещаниям блогера","По скорости ответа в чате","По официальным данным и документам, обсудив со взрослым"],3,"Официальные реестры и условия договора полезнее рекламных обещаний."]]},"digital":{"sections":[{"title":"Электронные платежи: проверка реквизитов","text":"Цифровой перевод переводит деньги со счёта или доступного баланса по заданным реквизитам. Перед подтверждением стоит сверить получателя, сумму и назначение платежа. Операции могут быть необратимы или сложны в отмене — всё зависит от способа перевода и правил сервиса. Не нужно отправлять реальные платёжные реквизиты на учебный сайт.","calculation":"Планировали перевести 12 500 ₸, но в поле суммы ошибочно поставили 125 000 ₸. Ошибка — 112 500 ₸, то есть неверная сумма больше плановой в 10 раз. Проверка перед подтверждением помогает заметить её.","lesson":"Подтверждение платежа — последняя возможность проверить введённые данные."},{"title":"Пароли, устройства и доступ","text":"Надёжный пароль должен быть уникальным; не стоит повторять один и тот же пароль на всех сервисах. Дополнительное подтверждение входа повышает защиту, но одноразовые коды также нужно хранить в секрете. Общедоступные устройства и подозрительные QR-коды требуют особой осторожности. Если произошла необычная операция, используй только официальные способы связи с сервисом.","calculation":"Если один пароль используется в пяти сервисах, его компрометация может создать риск сразу для пяти аккаунтов. Если у каждого сервиса свой уникальный пароль, проблема одного сервиса не означает автоматически доступ к остальным.","lesson":"Защита аккаунта — это сочетание пароля, осторожности и проверки операций."},{"title":"Волатильность и ограничения криптоактивов","text":"Криптоактивы могут резко дорожать и дешеветь, а их правовой режим отличается от режима банковских вкладов. Их цена не гарантирована государством или депозитным фондом. Для школьников достаточно учебного анализа изменений стоимости, без покупки настоящих криптоактивов и без действий с криптокошельками.","calculation":"Вымышленный цифровой актив стоил 40 000 ₸, подорожал до 50 000 ₸ (+25%), а затем упал до 30 000 ₸. Падение от 50 000 до 30 000 составляет 40%, а изменение от первоначальных 40 000 до 30 000 — −25%. Проценты считаются от разных баз.","lesson":"Рост на 25% и последующее падение на 25% не возвращают цену к исходной величине."},{"title":"Что важно знать о комиссиях","text":"Комиссия увеличивает фактические расходы на перевод или покупку. Проверяй условия тарифа до подтверждения; в разных каналах и сервисах они могут отличаться. В учебной формуле итог списания = сумма перевода + комиссия. Не следует считать условную комиссию из задачи актуальным тарифом любого казахстанского банка.","calculation":"В примере перевод 30 000 ₸ сопровождается учебной фиксированной комиссией 450 ₸. Всего спишут 30 450 ₸. Доля комиссии от суммы перевода: 450 ÷ 30 000 × 100% = 1,5%.","lesson":"Указанный тариф условный; реальные комиссии надо проверять перед операцией."}],"quiz":[["Хотели перевести 12 500 ₸, указали 125 000 ₸. На сколько ошиблись?",["100 000 ₸","110 000 ₸","112 500 ₸","125 000 ₸"],2,"125 000 − 12 500 = 112 500 ₸."],["Как лучше защитить несколько онлайн-аккаунтов?",["Использовать один пароль для всех","Использовать уникальный пароль для каждого","Сообщать пароли знакомым","Хранить пароли в публичных комментариях"],1,"Уникальные пароли уменьшают риск распространения компрометации одного аккаунта."],["Учебный актив вырос с 40 000 до 50 000 ₸. Каков рост?",["10%","20%","25%","30%"],2,"10 000 ÷ 40 000 × 100% = 25%."],["Актив упал с 50 000 до 30 000 ₸. Какой процент падения относительно 50 000 ₸?",["25%","30%","35%","40%"],3,"20 000 ÷ 50 000 × 100% = 40%."],["Перевод 30 000 ₸, комиссия 450 ₸. Сколько всего спишут?",["30 000 ₸","30 450 ₸","31 500 ₸","34 500 ₸"],1,"30 000 + 450 = 30 450 ₸."],["Какой процент составляет комиссия 450 ₸ от перевода 30 000 ₸?",["0,5%","1%","1,5%","2%"],2,"450 ÷ 30 000 × 100% = 1,5%."],["Что верно о криптоактивах в сравнении с банковским вкладом?",["Они имеют ту же гарантию КФГД","Их рыночная стоимость гарантирована","Они не подвержены колебаниям цены","Они не защищены гарантией банковских депозитов"],3,"КФГД гарантирует только определённые банковские продукты в установленных пределах, а не стоимость криптоактивов."]]}};
