const LESSONS_EN={"goals":{"title":"Money and financial goals","summary":"Understand needs and wants and learn to set realistic money goals.","intro":"Money is a tool for achieving goals, not an end in itself. Before buying something, distinguish between what you need and what you would simply like to have.","points":["A need is something important for daily life, such as food, safety or education.","A want is something you buy for enjoyment. Wants matter too, but you have to make choices.","A useful financial goal has an amount and a deadline, for example: save 30,000 ₸ in six months."],"example":"To save 30,000 ₸ in six months, you need to set aside 5,000 ₸ each month.","sections":[["Where money comes from and where it goes","Income can be regular, such as an agreed allowance, or occasional, such as a cash gift. Spending also differs: essential expenses cover real needs, while optional purchases offer leisure or enjoyment. Optional spending is not automatically bad. What matters is understanding trade-offs and not spending money reserved for essential goals.","Suppose a student receives 18,000 ₸ in monthly allowance: 6,000 ₸ goes to transport, 4,000 ₸ to food and 3,000 ₸ to entertainment. The balance is 18,000 − 6,000 − 4,000 − 3,000 = 5,000 ₸.","Record your income and divide spending into “need” and “want.” Discuss with your family which costs are essential."],["How to set a measurable goal","“I want a new bicycle” is not a plan. A specific goal includes what you want to buy, its total price, a deadline and a regular saving amount. First check whether that amount fits your budget. If not, extend the deadline, choose a less expensive goal, or discuss a lawful, safe way to earn extra money with a trusted adult.","A bicycle costs an illustrative 84,000 ₸. You have seven months to save: 84,000 ÷ 7 = 12,000 ₸ per month. If you can save only 8,000 ₸ monthly, 84,000 ÷ 8,000 = 10.5 months, so you need 11 monthly contributions (only 4,000 ₸ in the final month).","The purchase date depends on how much you can realistically save, not how quickly you want to buy."],["Priorities and opportunity cost","With a limited budget, buying one thing can mean giving up another. That is opportunity cost. Compare not only prices but also usefulness, durability and whether a purchase can wait. Borrowing for a nonessential purchase can leave you with payments long after the excitement fades.","You have 20,000 ₸. Headphones cost 17,000 ₸ and a book costs 6,000 ₸. Together they cost 23,000 ₸, so you cannot buy both right now. Buying the book leaves 14,000 ₸, which is 3,000 ₸ short of the headphones.","Ask yourself: “What am I giving up if I buy this?”"],["Understanding discounts","A discount lowers a price; it is not income. Compare the final price with your budget and ask whether you need the item at all. “20% off” does not automatically mean a bargain: the original price might have been inflated. A discounted item you do not need is still an expense.","An item originally costs 25,000 ₸ and is discounted by 20%. The discount is 25,000 × 0.20 = 5,000 ₸. The new price is 25,000 − 5,000 = 20,000 ₸. You still need 20,000 ₸ to buy it.","Decide whether you need the item before comparing prices and discounts."]],"quiz":[["What makes a financial goal measurable?",["“I want lots of money”","A specific amount and deadline","An attractive name","Someone else’s opinion"],1,"An amount and a deadline make it possible to create a practical plan."],["Which purchase is usually a need?",["Water and basic groceries","A third gaming accessory","A random souvenir","An extra pack of stickers"],0,"Basic groceries meet an essential need."],["Which approach helps you save for a goal?",["Buy everything immediately","Wait for an unexpected gift","Set aside some money regularly","Never record expenses"],2,"Regular saving makes progress toward a goal more predictable."],["You have 18,000 ₸; transport costs 6,000 ₸, food 4,000 ₸ and entertainment 3,000 ₸. What remains?",["3,000 ₸","5,000 ₸","7,000 ₸","9,000 ₸"],1,"18,000 − 6,000 − 4,000 − 3,000 = 5,000 ₸."],["You want to save 84,000 ₸ in seven months with no interest. How much per month?",["7,000 ₸","10,000 ₸","12,000 ₸","14,000 ₸"],2,"84,000 ÷ 7 = 12,000 ₸ per month."],["You have 20,000 ₸. Headphones cost 17,000 ₸ and a book 6,000 ₸. How much more is needed for both?",["1,000 ₸","2,000 ₸","3,000 ₸","4,000 ₸"],2,"17,000 + 6,000 − 20,000 = 3,000 ₸."],["An item costs 25,000 ₸ before a 20% discount. What is its new price?",["18,000 ₸","19,000 ₸","20,000 ₸","22,000 ₸"],2,"25,000 × (1 − 0.20) = 20,000 ₸."],["What should you do before an impulse purchase costing 15,000 ₸?",["Check the cost against your goals and budget","Borrow immediately","Ignore essential expenses","Buy because your friends own it"],0,"Checking your budget and priorities helps you understand the consequences."],["Saving 8,000 ₸ monthly without interest, how many full months does it take to reach at least 84,000 ₸?",["9","10","11","12"],2,"10 × 8,000 = 80,000 ₸, which is insufficient; 11 × 8,000 = 88,000 ₸."],["What is the opportunity cost of a choice?",["An extra banking fee","The lowest available price","The cost of advertising","An alternative you give up"],3,"When resources are limited, choosing one option means forgoing another."]]},"budget":{"title":"Personal and family budgets","summary":"Plan income and spending, manage your balance and prepare for future expenses.","intro":"A budget is a plan of income and expenses over a period of time. It helps you see where money goes and plan for essential payments.","points":["Income is money coming into a budget.","An expense is money going out of a budget.","Balance = income − expenses. A negative balance means a deficit."],"example":"Income of 200,000 ₸ minus expenses of 170,000 ₸ leaves 30,000 ₸.","sections":[["Three steps to a family budget","First list expected income. Next list essential costs: housing, groceries, utilities, transport, communication and other recurring needs. Then divide what remains between savings and optional spending. For children, a family budget is a model; nobody needs to disclose their real family finances. Invented figures are enough for learning.","In an example family, wages are 360,000 ₸ plus 40,000 ₸ of extra income: 400,000 ₸ total. Housing costs 140,000 ₸, food 110,000 ₸, transport 35,000 ₸ and utilities 25,000 ₸. Essential expenses total 310,000 ₸; 90,000 ₸ remains before other expenses.","Money remaining is not automatically savings: you may still need it for other expenses."],["Planned versus actual spending","Actual spending rarely matches the plan exactly. Record the main categories and compare them at the end of a week or month. If grocery spending exceeds the plan, first find out why: higher prices, guests or stocking up. Do not blame family members.","Food spending was budgeted at 95,000 ₸ but reached 104,000 ₸. Overspending = 104,000 − 95,000 = 9,000 ₸. If family income is 400,000 ₸ and other expenses are unchanged, the remaining balance falls by exactly 9,000 ₸.","The difference between actual and planned spending shows what to adjust next time."],["Percentages of income and reserves","Percentages reveal the structure of a budget. Category share = spending in that category ÷ income × 100%. There is no ideal ratio for every family: needs depend on household size, location, health and commitments. Show emergency savings and goal-based savings as separate budget categories.","With income of 400,000 ₸ and housing costs of 140,000 ₸, housing takes 140,000 ÷ 400,000 × 100% = 35%. Savings of 40,000 ₸ equal 10% of income.","Do not copy another family’s spending percentages without considering your own circumstances."],["Unexpected expenses","A budget is useful in difficult months, not only calm ones. Add an unexpected cost in the simulator and see whether it creates a deficit. If money is short, review optional spending first and discuss solutions with the family. This lesson does not require real income figures or other personal information from parents.","Income is 400,000 ₸ and normal expenses are 350,000 ₸, leaving 50,000 ₸. An unexpected repair of 75,000 ₸ raises expenses to 425,000 ₸. The result is 400,000 − 425,000 = −25,000 ₸: a deficit.","A negative balance means planned income is not enough for planned expenses."]],"quiz":[["Income is 120,000 ₸ and spending 95,000 ₸. What is the balance?",["15,000 ₸","20,000 ₸","25,000 ₸","35,000 ₸"],2,"120,000 − 95,000 = 25,000 ₸."],["Which of these is an expense?",["Wages","An internet bill","A cash gift received","Interest earned on a deposit"],1,"Paying for internet reduces available money."],["What does a budget deficit mean?",["Income exceeds expenses","Expenses are zero","Expenses exceed income","Savings are growing"],2,"A deficit occurs when expenses are greater than income."],["A family earns 360,000 ₸ plus another 40,000 ₸. What is total monthly income?",["360,000 ₸","380,000 ₸","400,000 ₸","440,000 ₸"],2,"360,000 + 40,000 = 400,000 ₸."],["Essential costs are 140,000 ₸, 110,000 ₸, 35,000 ₸ and 25,000 ₸. What is the total?",["300,000 ₸","310,000 ₸","320,000 ₸","330,000 ₸"],1,"140,000 + 110,000 + 35,000 + 25,000 = 310,000 ₸."],["Income is 400,000 ₸ and expenses 310,000 ₸. What remains before other spending?",["70,000 ₸","80,000 ₸","90,000 ₸","100,000 ₸"],2,"400,000 − 310,000 = 90,000 ₸."],["The food budget was 95,000 ₸, but actual spending was 104,000 ₸. How much was overspent?",["7,000 ₸","8,000 ₸","9,000 ₸","10,000 ₸"],2,"104,000 − 95,000 = 9,000 ₸."],["Housing costs 140,000 ₸ from income of 400,000 ₸. What percentage goes to housing?",["25%","30%","35%","40%"],2,"140,000 ÷ 400,000 × 100% = 35%."],["Income is 400,000 ₸, normal costs 350,000 ₸, and an unexpected repair costs 75,000 ₸. What is the result?",["25,000 ₸ surplus","25,000 ₸ deficit","50,000 ₸ surplus","75,000 ₸ deficit"],1,"400,000 − 350,000 − 75,000 = −25,000 ₸."],["Why compare planned and actual spending?",["To find differences and adjust the plan","To stop tracking income","To spend every last tenge","To hide essential payments"],0,"The comparison reveals overspending and helps improve the next budget."]]},"banks":{"title":"Banks and deposits","summary":"Learn how bank accounts, savings deposits and interest work.","intro":"Banks hold funds and process payments. A deposit places money with a bank under agreed conditions and may earn interest.","points":["Check the interest rate, term, top-up rules and early-withdrawal conditions.","Nominal and effective annual interest rates can be different.","Deposit protection depends on the country, institution, currency and product type."],"example":"In this simple-interest example, 100,000 ₸ at 10% a year earns 10,000 ₸ over one year before any applicable deductions, if the conditions stay unchanged.","sections":[["Accounts, cards and deposits are different","A bank account holds an accounting record of your funds and lets you transfer money. A payment card provides access to funds on an account. A deposit is opened under a specific savings agreement. Accessibility, interest and restrictions may differ. Read terms and fees instead of assuming that any advertised percentage works the same way.","Illustration: a current account holds 80,000 ₸ and a deposit holds 120,000 ₸. Together these products hold 200,000 ₸. But access to the deposit depends on its particular agreement.","A payment card provides access to an account; it is not itself a savings deposit."],["Simple interest and compounding","In a simple-interest learning example, interest = principal × annual rate × time in years. With compounding, interest is added to the balance and later interest can be calculated on a larger amount. Actual bank calculations depend on the agreement, timing and nominal or effective rates. These simplified formulas are not bank quotations.","Without compounding: 100,000 ₸ × 12% = 12,000 ₸ for one year, ending at 112,000 ₸. With annual compounding at an illustrative 10% for two years: 100,000 × 1.1 × 1.1 = 121,000 ₸. Interest earned is 21,000 ₸.","Do not confuse 10% per year with 10% every month; these are very different terms."],["Compare terms, not advertisements","When comparing deposits, check whether you can add or withdraw money, whether the rate can change, and the effective annual interest rate (APR/APY equivalent under local disclosure rules). Compare the same amounts, terms and compounding assumptions. Real offers can change, so the figures in this lesson are not current market offers.","In a one-year simple-interest example, 200,000 ₸ at 9% earns 18,000 ₸ while 11% earns 22,000 ₸. The difference is 4,000 ₸. This comparison does not account for withdrawal restrictions or compounding.","The interest rate is only one factor; access to funds and early-withdrawal rules also matter."],["How deposits are protected in Kazakhstan","The Kazakhstan Deposit Insurance Fund (KDIF) protects eligible deposits and accounts at member banks, subject to limits. According to the rules stated for November 2026 in this learning material: up to 20 million ₸ for savings deposits in tenge, 10 million ₸ for other tenge deposits and accounts, and the equivalent of 5 million ₸ for foreign-currency deposits. Multiple deposits in one bank are also subject to aggregation rules. This protection does not apply to the fictional investments in the simulator. Verify up-to-date limits with KDIF.","For an illustrative single ordinary tenge deposit of 11,000,000 ₸ at a participating bank, the product-type guarantee cap is 10,000,000 ₸; 1,000,000 ₸ is above that cap. This illustrates a limit, not the payout in any actual case.","Check current rules at kdif.kz. Deposit guarantees do not insure shares or cryptoassets."]],"quiz":[["What should you check before opening a deposit?",["Only the app’s colour","Interest rate, term and withdrawal rules","Only the bank’s logo","Advice from a random chat"],1,"Deposit terms determine access to funds and expected interest."],["How much simple interest does 100,000 ₸ earn at 10% per year for one year?",["1,000 ₸","5,000 ₸","10,000 ₸","20,000 ₸"],2,"100,000 × 0.10 = 10,000 ₸."],["Why should you compare deposit rates carefully?",["They are always identical","Terms and interest calculation methods differ","All deposits have the same term","Rates never change"],1,"Terms, restrictions and interest calculation methods vary."],["An account contains 80,000 ₸ and a deposit 120,000 ₸. What is the combined balance?",["160,000 ₸","180,000 ₸","200,000 ₸","220,000 ₸"],2,"80,000 + 120,000 = 200,000 ₸."],["What simple interest does 200,000 ₸ earn at 9% per year for one year?",["9,000 ₸","16,000 ₸","18,000 ₸","20,000 ₸"],2,"200,000 × 0.09 = 18,000 ₸."],["What is the final value of 100,000 ₸ at an illustrative annual rate of 10%, compounded once per year for two years?",["110,000 ₸","120,000 ₸","121,000 ₸","122,000 ₸"],2,"100,000 × 1.1² = 121,000 ₸."],["Which statement about a payment card is correct?",["A card provides access to a bank account","A card is always a separate deposit","Every card pays the same interest","Cards never have fees"],0,"A payment card lets you use money held in its linked account."],["Besides the rate, what should you compare between deposits?",["Card colour","Term and rules for withdrawals and top-ups","Number of advertisements","Website design"],1,"Access to funds and terms affect convenience and the outcome."],["Under the KDIF rules stated for November 2026, what is the maximum guarantee on one ordinary tenge deposit (not a savings deposit)?",["5 million ₸","10 million ₸","15 million ₸","20 million ₸"],1,"The stated limit for other tenge deposits is 10 million ₸. Check aggregation rules and current limits at kdif.kz."],["Why is a textbook simple-interest calculation not an exact prediction of bank returns?",["It always understates returns","Actual contracts specify calculations and restrictions","Banks never pay interest","Deposits must be riskier than shares"],1,"Accrual periods, compounding, withdrawal conditions and current fees affect the outcome."]]},"credit":{"title":"Loans and instalment plans","summary":"Understand borrowed money, repayment schedules and total borrowing costs.","intro":"A loan is money borrowed under an agreement that you must repay. A small monthly payment does not necessarily mean a low total cost.","points":["The principal is the amount borrowed.","Additional charges may include interest, fees and other agreed costs.","Before agreeing to borrow, examine the full repayment amount and your ability to pay."],"example":"If an item costs 80,000 ₸ and all contractual payments total 92,000 ₸, the extra cost is 12,000 ₸.","sections":[["What borrowing means","A loan is a contractual obligation to repay money. Instalment plans spread payments over time, but you still need to check whether total payments equal the listed price and whether extra services, fees or insurance apply. For students this section is practice in understanding terms, not encouragement to borrow. Family financial choices should be discussed with adults.","In a hypothetical zero-interest, fee-free instalment plan, a laptop costs 240,000 ₸ over 12 equal payments: 240,000 ÷ 12 = 20,000 ₸ a month; 240,000 ₸ total. If mandatory additional charges are 12,000 ₸, the total is 252,000 ₸.","The words “instalment plan” do not guarantee that there are no extra costs."],["Total repayment and extra cost","In a simplified example, extra borrowing cost = all required payments minus the item’s original price or the loan principal, as stated in the question. A monthly payment alone is not enough to assess a loan: a longer term may lower each payment while raising the overall cost. In real agreements, review the contract, schedule, effective annual interest rate and mandatory charges.","An item costs 180,000 ₸. The loan schedule requires 18,000 ₸ per month for 12 months. Total repayments: 18,000 × 12 = 216,000 ₸. Difference from the price: 216,000 − 180,000 = 36,000 ₸.","Calculate the total repayment before focusing on the monthly amount."],["Debt-service burden","Debt-service burden is the share of income spent on required loan payments. In this lesson, monthly loan payments ÷ monthly income × 100% gives that share. The percentage alone does not prove that borrowing is affordable: essential living costs, savings, reliable income and the loan agreement all matter. There is no single right percentage for every household.","A household earns 400,000 ₸ a month and must pay 80,000 ₸ on loans. Payments take 80,000 ÷ 400,000 × 100% = 20% of income. Before other expenses, 320,000 ₸ remains after repayments.","Even a low payment-to-income ratio can be difficult if little remains for essentials and unexpected costs."],["Missed payments and fraudulent offers","Overdue repayments can create extra costs and negatively affect credit history. The agreement and law determine the details. Be cautious of “instant loans without documents” that require paying money in advance to an unknown person. Teenagers only need to understand risks and how to verify offers, not take out real loans.","After essential expenses, 30,000 ₸ remains, but the upcoming payment is 35,000 ₸. The shortfall is 35,000 − 30,000 = 5,000 ₸. The plan should be reviewed before the due date.","Avoid trying to solve debt problems by taking on another poorly considered debt."]],"quiz":[["An item costs 80,000 ₸ and total contractual payments are 92,000 ₸. What is the extra cost?",["8,000 ₸","10,000 ₸","12,000 ₸","22,000 ₸"],2,"92,000 − 80,000 = 12,000 ₸."],["What should you check before signing a loan agreement?",["Only the advertising slogan","Only the first payment","Total cost and repayment schedule","How popular the product is"],2,"The total cost reveals the full financial commitment."],["Borrowed money is…",["A gift you never repay","Money you are obliged to repay","Income without obligations","An interest-bearing deposit"],1,"Borrowing creates a repayment obligation under the agreement."],["A laptop costs 240,000 ₸, paid in 12 equal instalments with no extra charges. What is each monthly payment?",["15,000 ₸","18,000 ₸","20,000 ₸","24,000 ₸"],2,"240,000 ÷ 12 = 20,000 ₸."],["An item costs 240,000 ₸ plus a mandatory charge of 12,000 ₸. What is the total?",["240,000 ₸","242,000 ₸","250,000 ₸","252,000 ₸"],3,"240,000 + 12,000 = 252,000 ₸."],["What is the total of 12 monthly payments of 18,000 ₸?",["180,000 ₸","198,000 ₸","216,000 ₸","226,000 ₸"],2,"18,000 × 12 = 216,000 ₸."],["An item costs 180,000 ₸ and required payments total 216,000 ₸. What is the difference?",["18,000 ₸","30,000 ₸","36,000 ₸","42,000 ₸"],2,"216,000 − 180,000 = 36,000 ₸."],["Income is 400,000 ₸ and loan payments are 80,000 ₸. What share of income goes to repayments?",["10%","15%","20%","25%"],2,"80,000 ÷ 400,000 × 100% = 20%."],["Which statement about instalment plans is correct?",["They never have additional charges","You must check the agreement and total cost","Their total cost is always zero","They do not need to be budgeted"],1,"A product name is not a substitute for checking all required payments."],["After essential costs, you have 30,000 ₸, but a loan payment is 35,000 ₸. How much is missing?",["3,000 ₸","4,000 ₸","5,000 ₸","6,000 ₸"],2,"35,000 − 30,000 = 5,000 ₸; the balance cannot cover the payment."]]},"reserve":{"title":"Emergency savings","summary":"Learn to build a reserve for unexpected essential expenses.","intro":"An emergency fund is money set aside for necessary unexpected costs or a temporary drop in income. Its appropriate size depends on the household.","points":["Keep emergency savings separate from everyday spending money.","Start by calculating essential monthly expenses.","Build the reserve gradually and keep it accessible in a suitable, reliable form."],"example":"If essential monthly costs are 150,000 ₸, a two-month reserve is 300,000 ₸. This is an example, not a universal rule.","sections":[["Emergency funds versus savings for wants","An emergency fund covers unexpected necessary spending, while a savings goal pays for something you plan to buy. Track them separately. An urgent repair should not be treated as having the same priority as a new games console. The right emergency-fund amount depends on family circumstances.","A family has 180,000 ₸ in an emergency fund and 60,000 ₸ separately for a holiday. Total savings are 240,000 ₸, but only 180,000 ₸ is the emergency fund. Using 50,000 ₸ from that fund leaves 130,000 ₸.","Two purposes require separate records: “unexpected necessities” and “planned purchases.”"],["How many months does the fund cover?","Emergency funds are often expressed as months of essential expenses. This is a comparison tool, not a universal requirement: months covered = emergency savings ÷ essential monthly expenses. Exclude optional purchases. When essential costs change, the months of coverage change too.","Essential expenses are 120,000 ₸ per month. Savings of 360,000 ₸ cover 360,000 ÷ 120,000 = 3 months. If expenses rise to 150,000 ₸, the same fund covers 360,000 ÷ 150,000 = 2.4 months.","Compare the fund with essential costs, not with income alone."],["How much to set aside","An emergency fund is rarely built in one day. Choose an affordable regular contribution and estimate the time needed. In simple exercises ignore interest to keep the arithmetic clear. If an essential cost arises, you can temporarily reduce contributions: a realistic plan is better than an unworkable promise.","The target is 240,000 ₸ and 60,000 ₸ is saved already. The gap is 180,000 ₸. Saving 15,000 ₸ per month takes 180,000 ÷ 15,000 = 12 months, excluding interest.","Small regular steps add up to an emergency fund."],["Liquidity and safety","Liquidity means how quickly an asset can be converted into money without a substantial loss in value. For emergencies, access and safety are usually more important than unusually high promised returns. A model may keep some money readily available, but actual storage choices depend on the product’s risks and rules.","An unexpected necessary repair costs 45,000 ₸ and 50,000 ₸ is accessible in the reserve. After payment, 50,000 − 45,000 = 5,000 ₸ remains. You can then plan to rebuild what you used.","Not every investment is a suitable replacement for readily accessible emergency cash."]],"quiz":[["What is the primary purpose of an emergency fund?",["Spontaneous expensive purchases","Unexpected essential expenses","Buying lottery tickets","Everyday entertainment"],1,"Emergency savings help protect a household from unexpected costs."],["Essential costs are 100,000 ₸ per month. How much covers three months?",["100,000 ₸","200,000 ₸","300,000 ₸","400,000 ₸"],2,"100,000 × 3 = 300,000 ₸."],["How should you treat an emergency fund?",["Money for any impulse purchase","A separate reserve","Guaranteed investment profit","Someone else’s debt"],1,"Keeping a separate reserve helps prevent spending it on ordinary wants."],["You have 180,000 ₸ in an emergency fund and 60,000 ₸ for a holiday. What is the emergency fund?",["60,000 ₸","120,000 ₸","180,000 ₸","240,000 ₸"],2,"Holiday savings are separate; the emergency reserve is 180,000 ₸."],["A fund of 360,000 ₸ covers essential costs of 120,000 ₸ monthly for how long?",["2 months","3 months","4 months","5 months"],1,"360,000 ÷ 120,000 = 3 months."],["A reserve is 360,000 ₸ and essential costs rise to 150,000 ₸ monthly. How long will it last?",["2 months","2.4 months","3 months","3.6 months"],1,"360,000 ÷ 150,000 = 2.4 months."],["Your goal is 240,000 ₸ and you have 60,000 ₸. How much remains to save?",["120,000 ₸","150,000 ₸","180,000 ₸","200,000 ₸"],2,"240,000 − 60,000 = 180,000 ₸."],["You need another 180,000 ₸ and can save 15,000 ₸ monthly without interest. How many months?",["10","11","12","13"],2,"180,000 ÷ 15,000 = 12 months."],["What matters most when keeping money for emergencies?",["Quick, safe access when needed","Maximum risk for possible gains","Difficulty accessing your money","Popularity of the advertisement"],0,"Emergency expenses call for readily available, safely held money."],["A reserve has 50,000 ₸ and an essential repair costs 45,000 ₸. What remains?",["2,500 ₸","5,000 ₸","10,000 ₸","15,000 ₸"],1,"50,000 − 45,000 = 5,000 ₸."]]},"invest":{"title":"Shares and bonds","summary":"Learn basic investment concepts, returns and risks without using real money.","intro":"A share usually represents ownership in a company; a bond is a debt obligation of its issuer. Investing involves risk and returns are not guaranteed.","points":["Share prices can rise or fall, and dividends are not guaranteed.","Bonds may pay coupons but carry default risk and market-price risk.","Diversification can reduce exposure to one issuer but does not remove all risks."],"example":"Two fictional shares at 5,000 ₸ each cost 10,000 ₸. If the price falls to 4,500 ₸, their combined market value becomes 9,000 ₸.","sections":[["What an investor buys","A share normally represents ownership in a company, a bond represents the issuer’s debt, and an investment fund pools investors’ money under a strategy. These instruments differ in rights, cash flows and risks. Explaining them in your own words matters more than memorising symbols. Every asset in this simulator is fictional; no real brokerage transactions are required.","A fictional share costs 8,000 ₸. Buying six without fees costs 6 × 8,000 = 48,000 ₸. This is the purchase cost, not a promise of future returns.","Buying an investment asset is different from opening a bank deposit."],["Share returns and losses","Changes in share prices can be measured in tenge or as percentages. Price return = (new price − purchase price) ÷ purchase price × 100%. A fall below the purchase price reduces the holding’s market value; the loss becomes realised if the asset is sold. Fees, taxes and dividends can change actual returns, so the simplified calculations state when they are excluded.","Four fictional shares were bought at 10,000 ₸ each, costing 40,000 ₸. At 11,500 ₸ each they are worth 46,000 ₸: a 6,000 ₸ gain, or 15%. At 9,000 ₸ they are worth 36,000 ₸: a 4,000 ₸ fall, or −10%.","A previous rise does not guarantee future growth."],["Bond coupons and credit risk","A bond may pay coupons. If sold before maturity, its market price can be above or below the purchase price. The issuer may also fail to meet obligations. Payment terms and maturity are specified in the issue documents. Here we use a simplified model with no real securities.","A fictional bond has a face value of 20,000 ₸ and an illustrative annual coupon of 8% of face value. With one payment per year, the coupon is 20,000 × 0.08 = 1,600 ₸. Five such bonds pay 8,000 ₸ in coupons over a year if the issuer pays in full.","A coupon does not eliminate risk and is not the same as a gain in the bond’s market price."],["Diversification and portfolio risk","Diversification spreads funds across assets and sources of risk. It can reduce dependence on one company but cannot prevent a market-wide fall. The virtual portfolio shows total value after trades and simulated price movements. Game prices follow scenarios; they are not forecasts of real markets.","A portfolio holds 300,000 ₸: shares 120,000 ₸, bonds 120,000 ₸ and cash 60,000 ₸. The proportions are 40%, 40% and 20%. If shares fall by 25% and other holdings are unchanged, the portfolio loses 120,000 × 0.25 = 30,000 ₸ and is worth 270,000 ₸.","Understanding the instrument and managing risk matter more than promises of quick money."]],"quiz":[["What does owning a share usually mean?",["Owning part of a company","A guaranteed profit","A free loan","A fixed salary"],0,"A share usually represents an ownership interest in a company."],["What is a bond coupon?",["A shop fee","An interest payment under the bond’s terms","The price of a share","A tax penalty"],1,"A coupon is a payment to the bondholder under the instrument’s terms."],["Which statement about investing is correct?",["Prices never fall","Profit is always guaranteed","Losses are possible","All assets have identical risks"],2,"Asset values can fall, and issuers may fail to meet obligations."],["Six fictional shares cost 8,000 ₸ each. What is the total purchase price without fees?",["42,000 ₸","46,000 ₸","48,000 ₸","54,000 ₸"],2,"6 × 8,000 = 48,000 ₸."],["Four shares were bought at 10,000 ₸ each; the price rose to 11,500 ₸. What is the total increase without fees?",["4,000 ₸","5,000 ₸","6,000 ₸","8,000 ₸"],2,"4 × (11,500 − 10,000) = 6,000 ₸."],["The price increased from 10,000 ₸ to 11,500 ₸. What was the percentage gain?",["10%","12%","15%","20%"],2,"(11,500 − 10,000) ÷ 10,000 × 100% = 15%."],["A bond has a face value of 20,000 ₸ and an illustrative annual coupon of 8%. What is one year’s coupon?",["800 ₸","1,200 ₸","1,600 ₸","2,000 ₸"],2,"20,000 × 0.08 = 1,600 ₸, assuming the issuer pays in full."],["A portfolio is worth 300,000 ₸ and holds 60,000 ₸ in cash. What is the cash share?",["10%","15%","20%","25%"],2,"60,000 ÷ 300,000 × 100% = 20%."],["Assets worth 120,000 ₸ fall by 25%; the other 180,000 ₸ is unchanged. What is the portfolio worth?",["240,000 ₸","250,000 ₸","270,000 ₸","290,000 ₸"],2,"120,000 × 0.75 + 180,000 = 270,000 ₸."],["Which description best matches diversification?",["Complete protection against losses","Holding only one issuer","Spreading funds across assets and risks","Guaranteed higher returns"],2,"Diversification reduces dependence on any one position but does not remove every risk."]]},"pension":{"title":"Saving for the future","summary":"Explore long-term savings, inflation and the role of time.","intro":"Long-term planning helps prepare for major goals and future expenses. Retirement savings are one example.","points":["Starting earlier allows more time for regular contributions.","Inflation affects the purchasing power of savings.","Actual pension rules depend on current legislation and can change."],"example":"Saving 5,000 ₸ every month for a year adds up to 60,000 ₸ before interest or investment returns.","sections":[["Long-term goals and consistency","Long-term goals need a deadline, a target amount and an affordable regular contribution. Compare scenarios: starting earlier versus saving small amounts regularly. Future returns are unknown, so start with calculations excluding interest. Choose a contribution you can sustain.","Saving 7,500 ₸ monthly for 24 months gives 7,500 × 24 = 180,000 ₸ without interest. Starting one year later but keeping the same target date leaves 12 months and produces only 90,000 ₸.","Consistent small contributions matter more than occasional large promises."],["How inflation works","Inflation means a rise in the general price level over time. It reduces how many goods a fixed sum of money can buy. Individual prices can change differently from the overall inflation rate. Always specify whether you are comparing nominal amounts or purchasing power.","A sample grocery basket cost 40,000 ₸ and costs 44,000 ₸ a year later. Its price increased by (44,000 − 40,000) ÷ 40,000 × 100% = 10%. With only 40,000 ₸, you now need another 4,000 ₸ for the same basket.","The 10% in this exercise is an illustrative basket-price change, not Kazakhstan’s actual inflation rate."],["Nominal amounts and purchasing power","A nominal balance is the number of tenge in an account. Real purchasing power reflects changes in prices. A simple exercise compares savings growth with the price of a particular basket. This is not a precise measure of economy-wide inflation, but illustrates the effect of time.","Savings rose from 100,000 ₸ to 108,000 ₸ (+8%). The price of the chosen basket rose from 100,000 ₸ to 112,000 ₸ (+12%). Even with 8,000 ₸ more money, the buyer is 4,000 ₸ short.","An increase in the number of tenge does not necessarily increase purchasing power."],["Kazakhstan’s retirement savings: the basics","Long-term pension savings in Kazakhstan are associated in part with the Unified Accumulative Pension Fund (UAPF, known locally as ENPF). Contributions, benefits and asset management are governed by law and may change. For this school lesson, it is enough to understand the purpose of pension savings and the long time horizon. This is not guidance on opening accounts or claiming benefits.","If someone contributes 10,000 ₸ every month to a separate long-term plan for five years, with no interest or withdrawals, the total contributions are 10,000 × 12 × 5 = 600,000 ₸.","Do not treat illustrative savings figures as current pension rules or actual return rates."]],"quiz":[["How much is saved in one year by putting aside 5,000 ₸ each month, without interest?",["30,000 ₸","50,000 ₸","60,000 ₸","75,000 ₸"],2,"5,000 × 12 = 60,000 ₸."],["What can reduce the purchasing power of money?",["Planning","Inflation","Recording expenses","Setting a financial goal"],1,"Rising prices mean a fixed amount of money may buy fewer goods."],["What helps a long-term plan?",["Reviewing goals regularly","Ignoring deadlines","Ignoring expenses","Expecting guaranteed returns"],0,"Reviewing goals helps you adapt to changing circumstances."],["You save 7,500 ₸ monthly for 24 months without interest. How much will you save?",["150,000 ₸","165,000 ₸","180,000 ₸","195,000 ₸"],2,"7,500 × 24 = 180,000 ₸."],["You save 7,500 ₸ monthly for 12 months without interest. How much will you save?",["75,000 ₸","90,000 ₸","105,000 ₸","120,000 ₸"],1,"7,500 × 12 = 90,000 ₸."],["A basket used to cost 40,000 ₸ and now costs 44,000 ₸. What was its price increase?",["5%","8%","10%","12%"],2,"4,000 ÷ 40,000 × 100% = 10%."],["The basket costs 44,000 ₸ but you have only 40,000 ₸. What is the shortfall?",["2,000 ₸","3,000 ₸","4,000 ₸","5,000 ₸"],2,"44,000 − 40,000 = 4,000 ₸."],["Savings grew to 108,000 ₸ and the required basket now costs 112,000 ₸. What is the result?",["4,000 ₸ left over","4,000 ₸ short","Exactly enough","8,000 ₸ short"],1,"112,000 − 108,000 = 4,000 ₸ short."],["What does the “nominal amount of savings” mean?",["The money amount in current currency units","The number of goods at old prices","A guaranteed real return","The inflation rate"],0,"A nominal value is not automatically adjusted for price changes."],["What is the role of Kazakhstan’s UAPF (ENPF)?",["Selling school textbooks","Participating in the pension savings system","Guaranteeing every share will rise","Setting shop prices"],1,"The UAPF is part of the pension savings system, whose rules are established by law."]]},"scams":{"title":"Fraud and financial pyramids","summary":"Spot misleading promises and protect your financial information.","intro":"Fraudsters often promise large profits with almost no risk, pressure people to act quickly and hide important terms. Financial safety starts with checking the facts.","points":["Never share passwords, one-time verification codes or account-access credentials.","Be suspicious of promises of guaranteed high returns.","Verify questionable offers through official sources and discuss them with a trusted adult."],"example":"If a stranger asks for an SMS code to “claim a prize,” do not share the code.","sections":[["Why promises of fast profits are dangerous","In a financial pyramid scheme, payouts to older participants are funded mainly by money from new participants rather than a sustainable business. The promoters may promise high guaranteed returns, pressure people to recruit friends or hide how the organisation operates. Even if someone received a payment, that does not prove the scheme is safe.","Suppose an offer promises to turn 50,000 ₸ into 75,000 ₸ in one month. The promised increase is 25,000 ₸, or 50% for that month. That figure is a reason to stop and investigate the offer, not evidence of an achievable return.","An exceptionally high promised return without a clear source of revenue is a serious warning sign."],["Scam messages and fake websites","A fraudster may impersonate a bank, delivery service or someone you know. Messages often use urgency, a link to a suspicious website or requests for codes and card details. Even a familiar sender name is not proof of authenticity. Open a service through its official app or a verified address rather than a link in an unexpected message.","An SMS says: “Your card is blocked; share the verification code within 60 seconds.” Do not share it. Contact the bank yourself through an official channel and, if necessary, ask a trusted adult for help.","Never forward one-time verification codes to anyone."],["How to verify a suspicious financial offer","Find out the organisation’s full legal name, contract terms, the source of promised returns and whether official information is available. In Kazakhstan, published guidance from regulators and official financial-market records can help. A polished website or celebrity advertisement is not a substitute for verification.","An offer has no clear contract but demands a 30,000 ₸ payment and recruitment of two friends. These are warning signs. The sensible learning choice is not to transfer money and to discuss the offer with a trusted adult.","Checks help reduce risk; advertising does not replace legal documentation."],["What to do if information has already been shared","If you shared data or suspect an unauthorised transaction, contact the bank or payment service through its official channels and involve a trusted adult. Avoid unknown “recovery specialists” who demand a fee to return money. Never enter real passwords, card details or private information into this learning platform.","A stranger asks for 5,000 ₸ in advance to “recover” a lost 20,000 ₸. The fee does not demonstrate that the money can be recovered. Use official support channels instead of sending another payment to a stranger.","If in doubt, stop the transaction and verify the information first."]],"quiz":[["A stranger asks for your bank’s SMS verification code. What should you do?",["Give it immediately","Send a photograph of it","Do not share the code","Post it publicly"],2,"A one-time code can authorise an operation or access an account."],["Which claim should raise concern?",["A written agreement","Guaranteed high profits with no risk","A clear explanation of risks","A way to verify the organisation"],1,"Guaranteed large returns without risk are a common warning sign."],["What should you do with a suspicious link?",["Enter your password at once","Forward it to friends","Check the address through official channels","Send your identity documents"],2,"Official channels help you avoid fake websites."],["An offer promises to turn 50,000 ₸ into 75,000 ₸ in one month. What percentage profit is promised?",["25%","40%","50%","75%"],2,"(75,000 − 50,000) ÷ 50,000 × 100% = 50%. A promise does not make the return real."],["What is often a feature of a financial pyramid?",["Payments depend mainly on recruiting new participants","Documented sales of real products","No promises of returns","Independent regulatory oversight"],0,"Pyramid schemes often pay earlier participants with contributions from newcomers."],["An SMS demands your bank code within one minute. What should you do?",["Share it because the message is urgent","Forward it to friends","Open a random link","Keep the code private and verify with the bank directly"],3,"Never give your verification code to strangers; contact the bank through a channel you choose."],["Why does a polished website not prove a financial company is legitimate?",["A professional design can exist without lawful business activity","All websites are prohibited","Websites cannot display text","Paper documents guarantee profits"],0,"Appearance alone does not establish legal standing or financial obligations."],["Which condition is a warning sign in an offer to earn money?",["Clear contractual terms","Explanation of risk","Recruiting new contributors is required to receive payouts","Official information about the business"],2,"Income that depends on continually recruiting people is a warning sign."],["A stranger asks for 5,000 ₸ up front to “recover” a lost 20,000 ₸. What is safer?",["Pay immediately","Do not pay; contact official support","Share a password to speed things up","Ask a friend to pay"],1,"Fake recovery services can defraud victims again."],["How should you check a financial offer in Kazakhstan?",["Number of likes","Promises made by influencers","How fast the chat replies","Official records and documents, with help from a trusted adult"],3,"Official records and contract terms are more useful than advertising claims."]]},"digital":{"title":"Digital payments and cryptoassets","summary":"Understand online payments, digital security and cryptoasset price volatility.","intro":"Digital payments are convenient but require care with personal information. Cryptoassets are a separate, high-risk asset class whose prices can change rapidly.","points":["Check both the recipient and amount before confirming a transfer.","Protect devices with passwords and use strong authentication.","Cryptoassets are not the same as bank deposits and do not offer equivalent deposit protection or guaranteed prices."],"example":"In this example, a fictional digital asset drops from 10,000 ₸ to 7,000 ₸, a 30% decline.","sections":[["Electronic payments and verifying details","Digital transfers move money from an account or available balance using the provided payment details. Before confirming, check the recipient, amount and payment purpose. Transfers may be irreversible or hard to cancel depending on the service. Never enter real payment information into this learning simulator.","You meant to transfer 12,500 ₸ but typed 125,000 ₸. The difference is 112,500 ₸ and the incorrect amount is ten times what you intended. Checking before confirmation can catch such an error.","Before confirming a payment, verify all entered details."],["Passwords, devices and account access","A strong password should be unique rather than reused across services. Additional login verification improves security, but one-time codes must also stay private. Be careful with shared devices and unfamiliar QR codes. If an unusual transaction occurs, use official service channels for help.","If you reuse a password on five services, its exposure may put five accounts at risk. With distinct passwords, a breach at one service does not automatically compromise the others.","Account security combines strong passwords, caution and checking your transactions."],["Cryptoasset volatility and limits","Cryptoassets can rapidly gain or lose value, and their legal treatment differs from bank deposits. Government or deposit guarantee funds do not guarantee their market prices. School students can study fictional price movements without buying real cryptoassets or using crypto wallets.","A fictional asset rises from 40,000 ₸ to 50,000 ₸ (+25%) and later falls to 30,000 ₸. The fall from 50,000 to 30,000 ₸ is 40%; the change from the starting 40,000 ₸ to 30,000 ₸ is −25%. These percentages have different starting values.","A 25% rise followed by a 25% fall does not restore the original price."],["Understanding fees","Fees increase the actual cost of a transfer or purchase. Check the service’s schedule of charges before confirming; fees can vary by channel. In the learning model, total debit = transfer amount + fee. A fictional fee from a question is not the current tariff of any bank in Kazakhstan.","An illustrative transfer of 30,000 ₸ has a fixed 450 ₸ fee, so 30,450 ₸ is debited. The fee as a percentage of the transfer is 450 ÷ 30,000 × 100% = 1.5%.","These fees are fictional; always check actual fees before paying."]],"quiz":[["What should you check before a transfer?",["Recipient and amount","Only the app background","A random advertisement","Follower count"],0,"Checking the recipient and amount helps prevent mistakes."],["An asset falls from 10,000 ₸ to 7,000 ₸. What is the percentage decline?",["10%","20%","30%","40%"],2,"A decline of 3,000 ₸ from 10,000 ₸ is 30%."],["Which statement about cryptoassets is correct?",["Their prices are always stable","They guarantee profits","Their prices can change sharply","They replace all emergency savings"],2,"Cryptoassets can be highly volatile and risky."],["You intended to transfer 12,500 ₸ but entered 125,000 ₸. How much is the difference?",["100,000 ₸","110,000 ₸","112,500 ₸","125,000 ₸"],2,"125,000 − 12,500 = 112,500 ₸."],["How should you secure several online accounts?",["Use the same password everywhere","Use a different password for each","Share passwords with friends","Post passwords in public comments"],1,"Unique passwords limit the damage if one account is compromised."],["A fictional asset rises from 40,000 ₸ to 50,000 ₸. What is the percentage increase?",["10%","20%","25%","30%"],2,"10,000 ÷ 40,000 × 100% = 25%."],["An asset drops from 50,000 ₸ to 30,000 ₸. What is the percentage decline from 50,000 ₸?",["25%","30%","35%","40%"],3,"20,000 ÷ 50,000 × 100% = 40%."],["A transfer is 30,000 ₸ and the fee is 450 ₸. What is the total debit?",["30,000 ₸","30,450 ₸","31,500 ₸","34,500 ₸"],1,"30,000 + 450 = 30,450 ₸."],["What percentage of a 30,000 ₸ transfer is a fee of 450 ₸?",["0.5%","1%","1.5%","2%"],2,"450 ÷ 30,000 × 100% = 1.5%."],["Which statement is true when comparing cryptoassets with bank deposits?",["They have the same KDIF guarantee","Their market value is guaranteed","Their prices never change","They are not covered by deposit insurance"],3,"KDIF protects certain eligible bank products up to set limits, not the market price of cryptoassets."]]}};

function tr(k,vars={}){const s=COPY[lang]?.[k]||COPY.ru[k]||k;return s.replace(/\{(\w+)\}/g,(_,name)=>String(vars[name]??''));}
function jobName(i){return JOB_LABELS[lang]?.[i]||JOBS[i][0];}
function missionName(i){return MISSION_LABELS[lang]?.[i]||MISSION_LABELS.ru[i];}
function sectorName(s){return SECTOR_LABELS[lang]?.[s]||s;}
function assetField(a,k){return ASSET_LABELS[a.id]?.[lang]?.[k]||a[k];}
function lessonData(i){const l=LESSONS[i]||LESSONS[0];const d=lang==='kk'?LESSONS_KK[l.id]:lang==='en'?LESSONS_EN[l.id]:null;return d?{...l,...d,sections:d.sections.map(s=>({title:s[0],text:s[1],calculation:s[2],lesson:s[3]}))}:l;}
function logText(entry){if(entry.text)return entry.text;const v={...(entry.vars||{})};if(typeof v.amount==='number')v.amount=m(v.amount);if(v.eventId!==undefined)v.title=EVENT_LABELS[lang][v.eventId][0];if(v.jobId!==undefined)v.name=jobName(v.jobId);if(v.missionId!==undefined)v.name=missionName(v.missionId);if(v.lessonId!==undefined)v.name=(lang==='en'?LESSONS_EN[v.lessonId].title:lang==='kk'?LESSONS_KK[v.lessonId].title:LESSONS.find(l=>l.id===v.lessonId)?.title)||v.lessonId;return tr(entry.key,v);}

const START={version:7,day:1,hour:11,minute:30,job:17,wallet:350000,deposit:100000,metals:{gold:0,silver:0},positions:{},xp:0,skills:0,food:2,feedDays:0,missions:[],completed:{},logs:[],loan:0,loanDue:0,metalSpent:0};
const KEY='kak-dengi-v7-demo-01';
let game=load(),tab='home',filter='',kind='all',sector='all',selectedLesson=0,quizAt=0,quizHits=0,quizLocked=false,lang=localStorage.getItem('kak-dengi-lang')||'ru';
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===7&&typeof x.wallet==='number')return x}catch(e){}return structuredClone(START)}
function save(){localStorage.setItem(KEY,JSON.stringify(game))}
const t=(k)=>TXT[lang]?.[k]||TXT.ru[k]||k;
const m=(v)=>Math.round(v).toLocaleString(lang==='en'?'en-US':'ru-RU')+' ₸';
const esc=(v)=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const signed=(x)=>`${x>0?'+':''}${x.toFixed(1)}%`;
function hash(n){let x=Math.sin(n*27.371+7.37)*43758.5453;return x-Math.floor(x)}
function price(a){let changes=0;for(let i=1;i<game.day;i++){changes+=(hash(i*199+Number(a.id.slice(2))*13)-.5)*(a.kind==='stock'?0.034:0.008);if(i%5===0)changes+=(hash(i*7+Number(a.id.slice(2)))-.5)*0.025;}return Math.max(100,Math.round(a.initial*(1+changes)*100)/100)}
function positionsVal(){return ASSETS.reduce((s,a)=>s+(game.positions[a.id]||0)*price(a),0)}
function metalPrice(k){const base=k==='gold'?48000:640;return Math.max(1,Math.round(base*(1+(hash(game.day*11+(k==='gold'?1:7))-.5)*.18)))}
function metalsVal(){return game.metals.gold*metalPrice('gold')+game.metals.silver*metalPrice('silver')}
function netWorth(){return game.wallet+game.deposit+positionsVal()+metalsVal()-game.loan}
function log(key,vars={}){game.logs.unshift({day:game.day,key,vars});game.logs=game.logs.slice(0,45)}
function update(){save();render()}
function eventFor(day){const eventId=Math.floor(hash(day*19.31)*EVENT_LABELS.ru.length);return {id:eventId,parts:EVENT_LABELS[lang][eventId]};}
function advanceDay(){game.day++;game.hour=11;game.minute=30;const ev=eventFor(game.day);if(game.food>0){game.food--;game.feedDays++;log('logFoodUse')}else{log('logFoodHelp')}if(game.day%30===0){game.wallet+=JOBS[game.job][1];log('logSalary',{amount:JOBS[game.job][1]});if(game.loan>0){let p=Math.min(game.wallet,Math.min(game.loan,12000));game.wallet-=p;game.loan-=p;log('logLoanPay',{amount:p})}}if(game.day%30===0&&game.deposit>0){let interest=Math.floor(game.deposit*.12/12);game.deposit+=interest;log('logDepositInterest',{amount:interest})}if(game.day%30===0){for(const a of ASSETS.filter(a=>a.kind==='bond')){const q=game.positions[a.id]||0;if(q){let interest=Math.floor(q*a.initial*(a.annual/100)/12);game.wallet+=interest;if(interest)log('logCoupon',{name:a.name,amount:interest})}}}log('logEvent',{eventId:ev.id});update()}
function trade(id,action){const a=ASSETS.find(x=>x.id===id);if(!a)return;let qty=Math.max(1,Math.min(10000,Math.floor(Number(document.getElementById('qty-'+id)?.value)||1))),value=Math.ceil(price(a)*qty);if(game.hour<11||game.hour>=18){alert(tr('errTradeClosed'));return}if(action==='buy'){if(game.wallet<value)return alert(tr('errMoney'));game.wallet-=value;game.positions[id]=(game.positions[id]||0)+qty}else{if((game.positions[id]||0)<qty)return alert(tr('errHolding'));game.wallet+=value;game.positions[id]-=qty}log(action==='buy'?'logBuy':'logSell',{name:a.name,qty,amount:value});update()}
function transfer(dir){let v=Math.floor(Number(document.getElementById('transferAmount')?.value));if(!Number.isSafeInteger(v)||v<=0)return alert(tr('errAmount'));if(dir==='toDeposit'){if(game.wallet<v)return alert(tr('errMoney'));game.wallet-=v;game.deposit+=v;log('logToDeposit',{amount:v})}else{if(game.deposit<v)return alert(tr('errDeposit'));game.deposit-=v;game.wallet+=v;log('logToWallet',{amount:v})}update()}
function purchaseFood(days){const cost=days*2500;if(game.wallet<cost)return alert(tr('errMoney'));game.wallet-=cost;game.food+=days;log('logFoodBought',{days,amount:cost});update()}
function mission(i){const list=[[7000,80],[8000,90],[9000,100],[11000,140],[10000,120],[12000,140]];if(game.missions.includes(i)||!list[i])return;const [pay,xp]=list[i];game.missions.push(i);game.wallet+=pay;game.xp+=xp;game.skills++;log('logMission',{missionId:i,amount:pay,xp});update()}
function chooseJob(i){if(!Number.isInteger(i)||i<0||i>=JOBS.length)return;game.job=i;log('logJob',{jobId:i});update()}
function buyMetal(k){let q=Number(document.getElementById('metalQty')?.value)||1;if(!Number.isInteger(q)||q<1||q>100)return alert(tr('errMetalCount'));let cost=Math.ceil(metalPrice(k)*q*1.03);if(game.wallet<cost)return alert(tr('errMoney'));game.wallet-=cost;game.metals[k]+=q;game.metalSpent+=cost;log(k==='gold'?'logBuyGold':'logBuySilver',{qty:q,amount:cost});update()}
function sellMetal(k){let q=Number(document.getElementById('metalQty')?.value)||1;if(!Number.isInteger(q)||q<1||q>game.metals[k])return alert(tr('errGram'));let income=Math.floor(metalPrice(k)*q*.97);game.wallet+=income;game.metals[k]-=q;log(k==='gold'?'logSellGold':'logSellSilver',{qty:q,amount:income});update()}
function takeLoan(){const n=50000;if(game.loan>0)return alert(tr('errLoan'));game.wallet+=n;game.loan+=Math.round(n*1.1);log('logLoan');update()}
function payLoan(){if(!game.loan)return;let p=Math.min(game.loan,game.wallet);game.wallet-=p;game.loan-=p;log('logDebt',{amount:p});update()}
function nav(){const links=[['home','🏠'],['life','🧑'],['work','💼'],['shop','🛒'],['bank','🏦'],['market','📊'],['learn','📚'],['news','📰'],['family','👨‍👩‍👧']];return links.map(([key,icon])=>`<button class="${tab===key?'active':''}" data-tab="${key}">${icon} ${t(key)}</button>`).join('')}
const stat=(label,value,extra='')=>`<div class="card"><div class="label">${label}</div><div class="stat money">${value}</div>${extra?`<div class="tiny">${extra}</div>`:''}</div>`;
function balance(){return `<div class="grid">${stat(t('wallet'),m(game.wallet))}${stat(t('deposit'),m(game.deposit))}${stat(t('assets'),m(positionsVal()+metalsVal()))}${stat(t('capital'),m(netWorth()),game.loan?tr('debt')+': '+m(game.loan):tr('noDebt'))}</div>`}
function home(){return `<div class="hero"><span class="pill warn">KAK деньги? · DEMO 7.2</span><h1 style="margin-top:12px">${t('start')}</h1><p>${tr('flow')}</p><div class="row"><div>📅 ${t('day')} <b>${game.day}</b> · 11:30–17:30</div><button class="btn" data-action="nextDay">⏩ ${t('next')}</button></div></div>${balance()}<div class="cols" style="margin-top:16px"><section class="card"><h2>🧑 ${t('life')}</h2><div class="row"><div class="avatar" style="width:126px;height:126px">${game.food?'🙂':'😌'}</div><div><b>${esc(jobName(game.job))}</b><div class="muted">${t('salary')}: ${m(JOBS[game.job][1])}/${t('month')}</div><div>${t('food')}: ${game.food} ${tr('days')}</div><div>${t('xp')}: <b>${game.xp}</b></div></div></div><div class="btn-row"><button class="btn secondary" data-tab="shop">🛒 ${t('shop')}</button><button class="btn secondary" data-tab="work">💼 ${t('missions')}</button></div></section><section class="card"><h2>📘 ${tr('financialHistory')}</h2>${game.logs.slice(0,5).map(l=>`<div class="item"><span class="tiny">${tr('dayOne')} ${l.day}</span><div>${esc(logText(l))}</div></div>`).join('')||`<p class="muted">${tr('noHistory')}</p>`}</section></div><section class="card" style="margin-top:16px"><h3>🔎 ${tr('tryIt')}</h3><p>${tr('trySteps')}</p><div class="note">${tr('offlineNotice')}</div></section>`}
function life(){let reserve=game.wallet+game.deposit;return `<h1>🧑 ${t('life')}</h1><p class="muted">${tr('lifeDesc')}</p><div class="cols"><div class="card"><div class="avatar">🧑‍💼</div><h2 style="margin-top:15px">${esc(jobName(game.job))}</h2><div class="row"><b>${tr('foodSupply')}</b><span class="pill ${game.food?'':'warn'}">${game.food} ${tr('days')}</span></div><div class="bar" style="margin:8px 0 15px"><i style="width:${Math.min(100,game.food/30*100)}%"></i></div><p>${tr('minimumFood')}</p><button class="btn" data-tab="shop">${tr('restock')}</button></div><div class="card"><h2>${tr('stability')}</h2>${stat(t('capital'),m(netWorth()))}<p class="rule">${tr('totalReserve')}: <b>${m(reserve)}</b></p><p>${tr('investmentAssets')}: <b>${m(positionsVal()+metalsVal())}</b></p><p>${tr('liabilities')}: <b>${m(game.loan)}</b></p><p>${tr('xpSeparated')} <b>${game.xp} XP</b></p></div></div>`}
function work(){return `<h1>💼 ${t('work')}</h1><p class="muted">${tr('workDesc')}</p><div class="cols"><section class="card"><h2>${tr('myProfession')}</h2><div class="field"><label>${tr('selectProfession')}</label><select id="jobSelect">${JOBS.map((j,i)=>`<option value="${i}" ${i===game.job?'selected':''}>${esc(jobName(i))} — ${m(j[1])}/${tr('monthAbbr')}</option>`).join('')}</select></div><div class="btn-row"><button class="btn" data-action="job">${t('choose')}</button></div><div class="note" style="margin-top:16px">${tr('jobNotice')}</div></section><section class="card"><h2>${t('missions')}</h2>${[[7000,80],[8000,90],[9000,100],[11000,140],[10000,120],[12000,140]].map(([pay,xp],i)=>`<div class="item"><b>${missionName(i)}</b><div class="tiny">+${m(pay)} · +${xp} XP · ${tr('demoMission')}</div><button class="btn ${game.missions.includes(i)?'light':'secondary'}" style="margin-top:8px" data-action="mission" data-id="${i}" ${game.missions.includes(i)?'disabled':''}>${game.missions.includes(i)?tr('completed'):tr('completeDemo')}</button></div>`).join('')}<div class="note notice">${tr('missionNotice')}</div></section></div>`}
function shop(){return `<h1>🛒 ${t('shop')}</h1><p class="muted">${tr('shopDesc')}</p>${balance()}<div class="grid" style="margin-top:16px">${[1,3,7,30].map(d=>`<div class="card"><h3>🥗 ${tr('foodBasket')}</h3><div class="muted">${tr('forDays',{days:d})}</div><div class="stat">${m(d*2500)}</div><p class="tiny">${tr('foodCost')}</p><button class="btn" data-action="food" data-id="${d}">${t('buy')}</button></div>`).join('')}</div>`}
function bank(){return `<h1>🏦 ${t('bank')}</h1><p class="muted">${tr('bankDesc')}</p>${balance()}<div class="cols" style="margin-top:16px"><section class="card"><h2>${tr('betweenAccounts')}</h2><div class="field"><label>${t('amount')}, ₸</label><input id="transferAmount" type="number" min="1" step="1" value="50000"></div><div class="btn-row"><button class="btn green" data-action="toDeposit">${t('wallet')} → ${t('deposit')}</button><button class="btn secondary" data-action="toWallet">${t('deposit')} → ${t('wallet')}</button></div><p class="tiny">${tr('withdrawNotice')}</p></section><section class="card"><h2>${tr('learningLoan')}</h2><p>${tr('loanTerms')}</p><div class="row"><b>${tr('debt')}: ${m(game.loan)}</b><span class="pill warn">${tr('liability')}</span></div><div class="btn-row"><button class="btn secondary" data-action="loan" ${game.loan?'disabled':''}>${tr('getLoan')}</button><button class="btn light" data-action="payLoan" ${!game.loan?'disabled':''}>${tr('repay')}</button></div></section></div><section class="card" style="margin-top:16px"><h2>🪙 ${tr('preciousMetals')}</h2><p>${tr('spreadNotice')}</p><div class="field"><label>${tr('grams')}</label><input id="metalQty" type="number" min="1" max="100" value="1"></div><div class="grid" style="margin-top:12px">${[['gold','gold'],['silver','silver']].map(([k,name])=>`<div class="card"><h3>${tr(name)}</h3><p>${tr('priceLabel')}: <b>${m(metalPrice(k))}/${tr('perGram')}</b></p><p>${tr('youHave')}: <b>${game.metals[k]} g</b></p><div class="btn-row"><button class="btn" data-action="buyMetal" data-id="${k}">${t('buy')}</button><button class="btn secondary" data-action="sellMetal" data-id="${k}">${t('sell')}</button></div></div>`).join('')}</div></section>`}
function market(){let data=ASSETS.filter(a=>(kind==='all'||a.kind===kind)&&(sector==='all'||a.sector===sector)&&(!filter||(`${a.name} ${a.story} ${assetField(a,'story')}`).toLowerCase().includes(filter.toLowerCase()))).slice(0,100);return `<h1>📈 ${t('market')}</h1><p class="muted">${tr('marketDesc')}</p><div class="row" style="margin:16px 0"><span class="pill">${tr('marketHours')}</span><button class="btn secondary" data-action="nextDay">⏩ ${t('next')}</button></div><div class="grid">${stat(tr('holdingsValue'),m(positionsVal()))}${stat(tr('positions'),Object.values(game.positions).filter(x=>x>0).length)}${stat(tr('companies'),ASSETS.length)}</div><div class="card" style="margin:16px 0"><div class="row"><div class="field"><label>${tr('search')}</label><input id="marketQuery" value="${esc(filter)}" placeholder="${tr('companyName')}"></div><div class="field"><label>${tr('instrument')}</label><select id="marketKind"><option value="all">${tr('all')}</option><option value="stock" ${kind==='stock'?'selected':''}>${tr('shares')}</option><option value="bond" ${kind==='bond'?'selected':''}>${tr('bonds')}</option></select></div><div class="field"><label>${tr('sector')}</label><select id="marketSector"><option value="all">${tr('allSectors')}</option>${[...new Set(ASSETS.map(a=>a.sector))].map(s=>`<option value="${esc(s)}" ${sector===s?'selected':''}>${esc(sectorName(s))}</option>`).join('')}</select></div><button class="btn secondary" data-action="filter">${tr('find')}</button></div></div><div class="grid">${data.map(a=>`<article class="card"><div class="row"><b>${esc(a.name)}</b><span class="pill ${a.kind==='bond'?'warn':''}">${a.kind==='stock'?tr('share'):tr('bond')}</span></div><p class="tiny">${esc(sectorName(a.sector))} · ${esc(a.symbol)}</p><div class="stat">${m(price(a))}</div><p class="small">${a.kind==='stock'?tr('dividend'):tr('coupon')}: ${a.annual}% ${tr('perYear')}</p><p class="tiny">${esc(assetField(a,'story'))}</p><p class="tiny"><b>${tr('risk')}:</b> ${esc(assetField(a,'risk'))}</p><p><b>${tr('inPortfolio')}:</b> ${game.positions[a.id]||0}</p><div class="row"><input aria-label="${tr('quantity')} ${esc(a.name)}" id="qty-${a.id}" type="number" value="1" min="1" style="width:78px"><button class="btn" data-action="tradeBuy" data-id="${a.id}">${t('buy')}</button><button class="btn secondary" data-action="tradeSell" data-id="${a.id}">${t('sell')}</button></div></article>`).join('')}</div>`}
function lesson(){
 const l=lessonData(selectedLesson);
 const qs=l.quiz||[]; const q=qs[quizAt];
 return `<h1>📚 ${t('learn')}</h1><p class="muted">${tr('lessonOverview')}</p><div class="cols"><div class="card"><h3>${tr('topics')}</h3>${LESSONS.map((x,i)=>`<div class="item"><button class="btn ${selectedLesson===i?'':'light'}" style="width:100%;text-align:left" data-action="lesson" data-id="${i}">${esc(x.icon)} ${esc(lessonData(i).title)} ${game.completed[x.id]?'✓':''}</button></div>`).join('')}</div><div class="card"><h2>${esc(l.title)}</h2><p>${esc(l.intro)}</p>${(l.points||[]).map(p=>`<p>• ${esc(p)}</p>`).join('')}<div class="note"><b>${tr('example')}:</b> ${esc(l.example)}</div>${(l.sections||[]).map(s=>`<div class="item"><h3>${esc(s.title||'')}</h3><p>${esc(s.text||'')}</p>${s.calculation?`<div class="note"><b>${tr('calculation')}:</b> ${esc(s.calculation)}</div>`:''}${s.lesson?`<p><b>${tr('takeaway')}:</b> ${esc(s.lesson)}</p>`:''}</div>`).join('')}<div class="rule"><h3>${tr('question')} ${quizAt+1} ${tr('of')} ${qs.length}</h3><p>${esc(q?.[0]||'')}</p>${q?.[1].map((opt,i)=>`<button class="quiz-opt" data-action="answer" data-id="${i}" ${quizLocked?'disabled':''}>${esc(opt)}</button>`).join('')||''}<div class="btn-row"><button id="nextQuiz" class="btn secondary" data-action="nextQuestion" ${!quizLocked?'disabled':''}>${tr('nextQuestion')}</button><span class="pill">${tr('correct')}: ${quizHits}</span></div><div id="answerFeedback" class="tiny">${quizLocked?'':tr('answerOnce')}</div></div></div></div>`
}
function news(){const current=eventFor(game.day);const recent=game.logs.filter(x=>x.key==='logEvent').slice(0,10);return `<h1>📰 ${t('news')}</h1><p class="muted">${tr('newsIntro')}</p><section class="card"><span class="pill warn">${tr('currentNews')} · ${tr('dayOne')} ${game.day}</span><h2 style="margin-top:12px">${esc(current.parts[0])}</h2><p>${esc(current.parts[1])}</p><div class="note">${tr('newsContext')}</div><div class="btn-row"><button class="btn secondary" data-action="nextDay">⏩ ${t('next')}</button></div></section><section class="card" style="margin-top:16px"><h2>${tr('newsHistory')}</h2>${recent.length?recent.map(x=>`<div class="item"><div class="tiny">${tr('dayOne')} ${x.day}</div><b>${esc(EVENT_LABELS[lang][x.vars.eventId][0])}</b><p class="tiny">${esc(EVENT_LABELS[lang][x.vars.eventId][1])}</p></div>`).join(''):`<p class="muted">${tr('notYet')}</p>`}</section>`}
function family(){return `<h1>👨‍👩‍👧 ${t('family')}</h1><div class="note notice">${tr('familyDemo')}</div><div class="grid" style="margin-top:16px">${stat(tr('finishedTopics'),Object.keys(game.completed).length+'/9')}${stat('XP',game.xp)}${stat(t('missions'),game.missions.length+'/6')}${stat(t('capital'),m(netWorth()))}</div><div class="card" style="margin-top:16px"><h2>${tr('educationOutcome')}</h2><p>${tr('outcomeDetails')}</p><p>${tr('noGrades')}</p></div>`}
function render(){document.documentElement.lang=lang;document.getElementById('lang').value=lang;document.getElementById('nav').innerHTML=nav();document.getElementById('mobileNav').innerHTML=nav();document.getElementById('subtitle').textContent=tr('subtitle');document.querySelector('footer').textContent=tr('demoDisclaimer');document.title='KAK деньги? — 7.2 · '+(lang==='kk'?'Қазақша':lang==='en'?'English':'Русский');document.querySelector('header .pill.warn').textContent=tr('statusDemo');document.getElementById('app').innerHTML=({home,life,work,shop,bank,market,learn:lesson,news,family}[tab]||home)()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return}const a=b.dataset.action,id=b.dataset.id;if(!a)return;
if(a==='nextDay')advanceDay();if(a==='food')purchaseFood(Number(id));if(a==='job')chooseJob(Number(document.getElementById('jobSelect')?.value));if(a==='mission')mission(Number(id));if(a==='toDeposit')transfer('toDeposit');if(a==='toWallet')transfer('toWallet');if(a==='loan')takeLoan();if(a==='payLoan')payLoan();if(a==='buyMetal'||a==='sellMetal'){a==='buyMetal'?buyMetal(id):sellMetal(id)}if(a==='tradeBuy'||a==='tradeSell')trade(id,a==='tradeBuy'?'buy':'sell');if(a==='filter'){filter=document.getElementById('marketQuery')?.value||'';kind=document.getElementById('marketKind')?.value||'all';sector=document.getElementById('marketSector')?.value||'all';render()}if(a==='lesson'){selectedLesson=Number(id);quizAt=0;quizHits=0;quizLocked=false;render()}if(a==='answer'){if(quizLocked)return;const q=lessonData(selectedLesson).quiz[quizAt];const ok=Number(id)===q[2];if(ok)quizHits++;quizLocked=true;const feedback=document.getElementById('answerFeedback');if(feedback)feedback.textContent=(ok?tr('quizCorrect'):tr('quizIncorrect'))+' '+q[3];const next=document.getElementById('nextQuiz');if(next)next.disabled=false;}if(a==='nextQuestion'){if(!quizLocked)return;const l=LESSONS[selectedLesson];if(quizAt+1>=l.quiz.length){if(!game.completed[l.id]){game.completed[l.id]=true;game.xp+=100;log('lessonComplete',{lessonId:l.id})}quizAt=0;quizHits=0}else{quizAt++}quizLocked=false;update()}});
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('kak-dengi-lang',lang);render()});render();
</script></body></html>
