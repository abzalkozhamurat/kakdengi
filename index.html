const LESSONS_KK={"goals":{"title":"Ақша және қаржылық мақсаттар","intro":"Ақша — өмірлік қажеттіліктерді өтеуге және мақсатқа жетуге көмектесетін құрал. Сатып алмас бұрын қажеттілік пен қалауды ажыратып, таңдаудың салдарын бағалаған жөн.","points":["Қажеттілік — азық-түлік, қауіпсіздік, білім алу сияқты негізгі мұқтаждық.","Қалау — қуаныш сыйлайтын, бірақ міндетті емес сатып алу. Оған да саналы таңдау керек.","Нақты қаржылық мақсатта сома мен мерзім көрсетіледі: мысалы, 6 айда 30 000 ₸ жинау."],"example":"6 айда 30 000 ₸ жинау үшін ай сайын 30 000 ÷ 6 = 5 000 ₸ бөліп отыру қажет.","sections":[["Ақша қайдан келеді және қайда жұмсалады","Табыс тұрақты болуы мүмкін: мысалы, ай сайын берілетін қалтаақы. Бір реттік табысқа ақшалай сыйлық жатады. Шығыстарды міндетті және міндетті емес деп ажыратуға болады. Міндетті емес шығынның бәрі жаман емес, бірақ ол негізгі қажеттіліктерге арналған ақшаны азайтпауы тиіс.","Айлық қалтаақы — 18 000 ₸. Жолақы — 6 000 ₸, тамақ — 4 000 ₸, ойын-сауық — 3 000 ₸. Қалдық: 18 000 − 6 000 − 4 000 − 3 000 = 5 000 ₸.","Табысыңды жазып, шығындарды «қажет» және «қалаймын» деп бөл."],["Өлшенетін қаржылық мақсат қою","«Велосипед алғым келеді» деген ойдың өзі әлі жоспар емес. Жоспарда заттың бағасы, жинау мерзімі және ай сайынғы салым көрсетіледі. Салым қолда бар бюджетке сыймаса, мерзімді ұзартуға не мақсатыңды қайта қарауға болады.","Велосипед 84 000 ₸ тұрады. 7 айда жинау үшін айына 84 000 ÷ 7 = 12 000 ₸ қажет. Айына 8 000 ₸ жинасаң, 11 ай керек: 10 айда 80 000 ₸, ал соңғы айда 4 000 ₸ жеткілікті.","Мақсаттың мерзімін нақты жинай алатын сомаға сай белгіле."],["Басымдық және баламалы құн","Ақша шектеулі болғанда бір таңдауды жасау басқа мүмкіндіктен бас тартуды білдіреді. Осы жоғалтылған мүмкіндік баламалы құн деп аталады. Бағамен бірге заттың пайдасын, төзімділігін және сатып алуды кейінге қалдыру мүмкіндігін ескер.","Қолыңда 20 000 ₸ бар. Құлаққап — 17 000 ₸, кітап — 6 000 ₸. Екеуі бірге 23 000 ₸, сондықтан 3 000 ₸ жетпейді. Кітапты алсаң, 14 000 ₸ қалады.","«Мұны алсам, неден бас тартамын?» деген сұрақ асығыс шығыннан сақтайды."],["Жеңілдікті қалай есептеу керек","Жеңілдік — бағаның төмендеуі, табыс емес. Алдымен заттың шынымен қажет екенін, кейін жеңілдіктен кейінгі бағасын тексер. Бастапқы баға көтеріліп көрсетілуі де мүмкін.","Бағасы 25 000 ₸ тауарға 20% жеңілдік берілді. Жеңілдік: 25 000 × 0,20 = 5 000 ₸. Жаңа баға: 25 000 − 5 000 = 20 000 ₸.","Қажет емес затқа жеңілдікпен ақша жұмсау да шығын."]],"quiz":[["Қаржылық мақсатты өлшенетін ететін не?",["«Көп ақшам болсын» деген сөз","Нақты сома мен мерзім","Әдемі атау","Басқаның пікірі"],1,"Нақты сома мен мерзім жоспар құруға мүмкіндік береді."],["Қай сатып алу көбіне қажеттілікке жатады?",["Су және негізгі азық-түлік","Үшінші ойын аксессуары","Кездейсоқ кәдесый","Қосымша жапсырма жинағы"],0,"Негізгі азық-түлік өмірлік қажеттілікті өтейді."],["Мақсатқа ақша жинауға қай тәсіл тиімдірек?",["Бәрін бірден сатып алу","Кездейсоқ сыйлықты күту","Ақшаның бір бөлігін тұрақты жинау","Шығынды мүлде жазбау"],2,"Тұрақты жинақ мақсатқа жетуді жоспарлы етеді."],["18 000 ₸ бар; жолақы — 6 000 ₸, тамақ — 4 000 ₸, ойын-сауық — 3 000 ₸. Қанша ақша қалады?",["3 000 ₸","5 000 ₸","7 000 ₸","9 000 ₸"],1,"18 000 − 6 000 − 4 000 − 3 000 = 5 000 ₸."],["Табыстылықсыз 7 айда 84 000 ₸ жинау үшін ай сайын қанша бөлу керек?",["7 000 ₸","10 000 ₸","12 000 ₸","14 000 ₸"],2,"84 000 ÷ 7 = айына 12 000 ₸."],["20 000 ₸ жиналды. Құлаққап 17 000 ₸, кітап 6 000 ₸. Екеуін алуға қанша жетпейді?",["1 000 ₸","2 000 ₸","3 000 ₸","4 000 ₸"],2,"17 000 + 6 000 − 20 000 = 3 000 ₸."],["Тауар 25 000 ₸, жеңілдік 20%. Жеңілдіктен кейінгі баға қанша?",["18 000 ₸","19 000 ₸","20 000 ₸","22 000 ₸"],2,"25 000 × (1 − 0,20) = 20 000 ₸."],["15 000 ₸ тұратын ойланбай сатып алудан бұрын не істеу керек?",["Бағаны мақсатыңмен және бюджетіңмен салыстыру","Бірден қарыз алу","Міндетті шығынды елемеу","Таныстарда бар болғаны үшін алу"],0,"Бюджетпен салыстыру сатып алудың салдарын көруге көмектеседі."],["Ай сайын 8 000 ₸ жинасаң, табыстылықсыз кемінде 84 000 ₸ жинау үшін неше толық ай керек?",["9","10","11","12"],2,"10 × 8 000 = 80 000 ₸ — жеткіліксіз; 11 × 8 000 = 88 000 ₸."],["Таңдаудың баламалы құны деген не?",["Қосымша банк комиссиясы","Ең арзан баға","Жарнама бағасы","Бас тартуға тура келетін мүмкіндік"],3,"Ақша шектеулі болғандықтан бір таңдауды жасау басқа мүмкіндіктен бас тартуды білдіреді."]]},"budget":{"title":"Жеке және отбасылық бюджет","intro":"Бюджет — белгілі бір кезеңдегі табыс пен шығыстың жоспары. Ол ақшаның қайда жұмсалатынын көруге және міндетті төлемдерді алдын ала есептеуге көмектеседі.","points":["Табыс — бюджетке түсетін ақша.","Шығыс — бюджеттен жұмсалатын ақша.","Қалдық = табыс − шығыс. Нәтиже теріс болса, бюджет тапшылығы бар."],"example":"Табыс 200 000 ₸, шығыс 170 000 ₸ болса, қалдық 200 000 − 170 000 = 30 000 ₸.","sections":[["Отбасылық бюджеттің үш кезеңі","Алдымен барлық кірісті жаз. Кейін баспана, тамақ, коммуналдық қызмет, көлік пен байланыс сияқты қажетті шығыстарды есепте. Қалған ақшаны жинақ пен қосымша шығындарға бөл. Оқу үшін отбасының шынайы табысын жариялау қажет емес — ойдан алынған сандар жеткілікті.","Еңбекақы 360 000 ₸ және қосымша табыс 40 000 ₸: барлығы 400 000 ₸. Баспана 140 000 ₸, тамақ 110 000 ₸, көлік 35 000 ₸, коммуналдық қызмет 25 000 ₸. Міндетті шығын 310 000 ₸, басқа шығындарға дейін 90 000 ₸ қалады.","Қалған ақша түгелдей жинақ емес: одан басқа шығындар да төленуі мүмкін."],["Жоспар мен нақты шығынды салыстыру","Іс жүзіндегі шығын жоспардан өзгеше болуы мүмкін. Ай соңында айырманы есептеп, себебін анықтау пайдалы. Мысалы, азық бағасы өскен, қонақ келген немесе азық қоры алынған болуы мүмкін.","Тамаққа 95 000 ₸ жоспарланды, ал 104 000 ₸ жұмсалды. Артық шығын: 104 000 − 95 000 = 9 000 ₸. Басқа шығындар өзгермесе, қалдық 9 000 ₸-ге азаяды.","«Нақты − жоспар» айырмасы келесі бюджетті түзетуге көмектеседі."],["Табыстың үлесі және резерв","Шығыстың табыстағы үлесі = санат шығыны ÷ жалпы табыс × 100%. Барлық отбасыға ортақ «мінсіз» үлес жоқ: жағдай мен міндеттемелер әртүрлі. Күтпеген жағдайға резервті және нақты мақсатқа жинақты бөлек көрсет.","400 000 ₸ табыстың 140 000 ₸-і баспанаға жұмсалса, үлесі 35%. Егер 40 000 ₸ жиналса, жинақ үлесі 10%.","Өз отбасыңның жағдайын ескермей, өзгенің пайыздарын көшірме."],["Күтпеген шығын туындағанда","Жоспарға кірмеген қажетті шығын бюджет тапшылығын тудыруы мүмкін. Алдымен міндетті емес шығындарды қайта қарап, отбасымен қауіпсіз шешімді талқылаған дұрыс.","Табыс 400 000 ₸, әдеттегі шығын 350 000 ₸. Күтпеген жөндеу 75 000 ₸ тұрды. Қалдық: 400 000 − 350 000 − 75 000 = −25 000 ₸. Бұл — 25 000 ₸ тапшылық.","Теріс қалдық жоспарланған кірістің жеткіліксіз екенін білдіреді."]],"quiz":[["Табыс 120 000 ₸, шығыс 95 000 ₸. Қалдық қанша?",["15 000 ₸","20 000 ₸","25 000 ₸","35 000 ₸"],2,"120 000 − 95 000 = 25 000 ₸."],["Қайсысы шығысқа жатады?",["Жалақы","Интернет ақысын төлеу","Ақшалай сыйлық","Депозит сыйақысы"],1,"Интернет ақысы төленгенде ақша қалдығы азаяды."],["Бюджет тапшылығы нені білдіреді?",["Табыс шығыстан көп","Барлық шығын нөлге тең","Шығыс табыстан көп","Жинақ өседі"],2,"Шығыс табыстан асса, тапшылық пайда болады."],["Отбасы 360 000 ₸ және қосымша 40 000 ₸ алады. Айлық жалпы табыс қанша?",["360 000 ₸","380 000 ₸","400 000 ₸","440 000 ₸"],2,"360 000 + 40 000 = 400 000 ₸."],["Міндетті шығындар: 140 000 ₸, 110 000 ₸, 35 000 ₸, 25 000 ₸. Барлығы қанша?",["300 000 ₸","310 000 ₸","320 000 ₸","330 000 ₸"],1,"140 000 + 110 000 + 35 000 + 25 000 = 310 000 ₸."],["Табыс 400 000 ₸, шығыс 310 000 ₸. Басқа шығындарға дейін қанша қалады?",["70 000 ₸","80 000 ₸","90 000 ₸","100 000 ₸"],2,"400 000 − 310 000 = 90 000 ₸."],["Тамаққа 95 000 ₸ жоспарлап, 104 000 ₸ жұмсады. Артық шығын қанша?",["7 000 ₸","8 000 ₸","9 000 ₸","10 000 ₸"],2,"104 000 − 95 000 = 9 000 ₸."],["Табыс 400 000 ₸, баспана шығыны 140 000 ₸. Табыстың қанша пайызы баспанаға кетеді?",["25%","30%","35%","40%"],2,"140 000 ÷ 400 000 × 100% = 35%."],["Табыс 400 000 ₸, әдеттегі шығын 350 000 ₸, күтпеген жөндеу 75 000 ₸. Нәтиже қандай?",["25 000 ₸ қалдық","25 000 ₸ тапшылық","50 000 ₸ қалдық","75 000 ₸ тапшылық"],1,"400 000 − 350 000 − 75 000 = −25 000 ₸."],["Жоспарланған және нақты шығынды не үшін салыстырады?",["Ауытқуды анықтап, жоспарды түзету үшін","Табыс есебінен бас тарту үшін","Жалақыны толық жұмсау үшін","Міндетті төлемді жасыру үшін"],0,"Салыстыру артық шығынды анықтап, жоспарды өзгертуге көмектеседі."]]},"banks":{"title":"Банктер және депозиттер","intro":"Банк қаражатты сақтауға және төлем жасауға көмектеседі. Депозит — банкке келісімшарт талаптарымен салынатын ақша; оған сыйақы есептелуі мүмкін.","points":["Депозит ашарда мөлшерлемені, мерзімді, толықтыру және мерзімінен бұрын алу шарттарын тексер.","Номиналды мөлшерлеме мен жылдық тиімді мөлшерлеме бірдей болмауы мүмкін.","Депозитті қорғау ережелері елге, банкке, валютаға және өнім түріне байланысты."],"example":"Оқу есебінде 100 000 ₸ сомасына жылына 10% жай пайыз есептелсе, бір жылдағы сыйақы 10 000 ₸ болады (басқа ұсталымдарды ескермегенде).","sections":[["Шот, карта және депозиттің айырмасы","Банк шоты ақшаны есепке алу және аудару үшін керек. Карта — шоттағы ақшаға қол жеткізу құралы. Депозит жеке шарттармен рәсімделеді: ақшаға қолжетімділік пен сыйақы тәртібі өзгеше болуы мүмкін.","Ағымдағы шотта 80 000 ₸, депозитте 120 000 ₸ болса, барлығы 200 000 ₸. Бірақ депозиттегі ақшаны алу мүмкіндігі келісімшартқа байланысты.","Картаны депозитпен шатастырма: төлем картасы — шотқа қол жеткізу тәсілі."],["Жай пайыз және капиталдандыру","Жай пайыз бойынша сыйақы бастапқы салымнан есептеледі. Капиталдандыру кезінде есептелген сыйақы салымға қосылып, келесі кезеңдегі есептеу базасын өсіреді. Нақты банк шарттары оқу формуласынан өзгеше болуы мүмкін.","100 000 ₸ сомасына жылдық жай 12%: бір жылдағы сыйақы 12 000 ₸, қорытынды 112 000 ₸. Жылына 10% және жыл сайын капиталдандыру болса, екі жылдан кейін 100 000 × 1,1 × 1,1 = 121 000 ₸.","«Жылына 10%» дегенді «ай сайын 10%» деп түсінуге болмайды."],["Жарнама емес, шарттарды салыстыр","Екі депозитті салыстырғанда тек жарнамадағы пайызға қарама. Мерзімін, тиімді мөлшерлемені, толықтыру мүмкіндігін, мерзімінен бұрын алғанда не болатынын және комиссияларды тексер.","Жылына 12% жай пайызбен 100 000 ₸ бір жылда 12 000 ₸ береді. Ал 10% капиталдандыруы бар салымның екі жылдағы нәтижесі — 121 000 ₸. Бұл мысалдар әртүрлі мерзімге қатысты, сондықтан тікелей «қайсысы жақсы» деу дұрыс емес.","Бірдей соманы, мерзімді және қолжетімділік шарттарын салыстыр."],["Қазақстанда депозиттер қалай қорғалады","Қазақстанның депозиттерге кепілдік беру қоры (ҚДКҚ) қатысушы банктердегі белгілі бір салым түрлеріне заңда көрсетілген шектерде кепілдік береді. Кепілдік шегі салым түрі мен валютасына қарай өзгереді. Оқу материалындағы шекті нақты шешімге негіз етпей, қордың ресми сайтынан тексеру керек.","Мысалы, депозитке кепілдік шегі белгілі бір түрге 10 млн ₸ деп көрсетілсе, бұл кез келген шотта қандай сомада болса да толық кепілдік бар дегенді білдірмейді. Бір банктегі салымдарды есептеу ережелері де маңызды.","Жаңартылған ережелерді ресми kdif.kz сайтынан қара."]],"quiz":[["Депозит ашудан бұрын нені тексеру маңызды?",["Қосымшаның түсін ғана","Мөлшерлеме, мерзім және алу шарттарын","Банк логотипін ғана","Кездейсоқ чаттағы кеңесті"],1,"Салым шарты ақшаға қолжетімділік пен сыйақыны анықтайды."],["100 000 ₸ сомасына жылына 10% жай пайыз есептелсе, бір жылдағы сыйақы қанша?",["1 000 ₸","5 000 ₸","10 000 ₸","20 000 ₸"],2,"100 000 × 0,10 = 10 000 ₸."],["Неге депозит мөлшерлемелерін мұқият салыстыру керек?",["Олар әрқашан бірдей","Шарттар мен есептеу тәртібі әртүрлі","Барлығының мерзімі бірдей","Мөлшерлеме ешқашан өзгермейді"],1,"Салымдардың мерзімі, шектеуі және сыйақыны есептеу тәсілі әртүрлі."],["Шотта 80 000 ₸, депозитте 120 000 ₸ бар. Жалпы ақша қанша?",["160 000 ₸","180 000 ₸","200 000 ₸","220 000 ₸"],2,"80 000 + 120 000 = 200 000 ₸."],["200 000 ₸ сомасына бір жылға 9% жай пайыз есептелсе, сыйақы қанша?",["9 000 ₸","16 000 ₸","18 000 ₸","20 000 ₸"],2,"200 000 × 0,09 = 18 000 ₸."],["100 000 ₸ сомасына жылына 10%, жыл сайын капиталдандыру, мерзімі 2 жыл. Қорытынды сома қанша?",["110 000 ₸","120 000 ₸","121 000 ₸","122 000 ₸"],2,"100 000 × 1,1² = 121 000 ₸."],["Банк картасы туралы қай тұжырым дұрыс?",["Карта — банк шотына қол жеткізу құралы","Карта әрқашан жеке депозит","Кез келген карта бірдей пайыз береді","Карталарда тариф болмайды"],0,"Карта байланысты шоттағы қаражатты пайдалануға көмектеседі."],["Мөлшерлемеден бөлек екі депозиттің нені салыстырған жөн?",["Картаның түсін","Алу, толықтыру ережесі мен мерзімін","Жарнама саны","Сайт дизайнын"],1,"Ақшаға қол жеткізу мен салым талаптары нәтижеге әсер етеді."],["2026 жылғы қарашадағы ереже бойынша теңгедегі кәдімгі (жинақ емес) салымға ҚДКҚ кепілдігінің ең жоғары шегі қанша?",["5 млн ₸","10 млн ₸","15 млн ₸","20 млн ₸"],1,"2026 жылғы қарашадағы материалдағы кәдімгі теңгелік салым үшін шек — 10 млн ₸. Ережені kdif.kz ресми сайтынан қайта тексер."],["Неге оқулықтағы жай пайыз есебі нақты банктік болжам болып саналмайды?",["Өйткені есеп әрқашан табысты кемітеді","Нақты шарт сыйақы есептеу тәртібі мен шектеулерді белгілейді","Банктер сыйақы төлемейді","Әр депозит акциядан міндетті түрде тәуекелдірек"],1,"Нақты есепте мерзім, капиталдандыру, алу тәртібі және тариф ескеріледі."]]},"credit":{"title":"Кредиттер және бөліп төлеу","intro":"Кредит — келісілген шартпен қайтарылуға тиіс қарыз ақша. Ай сайынғы төлем аз болып көрінсе де, барлық төлемнің жиынтығын есептеу маңызды.","points":["Негізгі борыш — қарызға алынған сома.","Қосымша шығынға пайыз, комиссия және шарттағы басқа төлемдер кіруі мүмкін.","Шартқа қол қоймас бұрын төлем кестесі мен толық құнын тексер."],"example":"Тауар бағасы 80 000 ₸, шарт бойынша барлық төлем 92 000 ₸ болса, артық төлем 12 000 ₸.","sections":[["Қарыз алу нені білдіреді","Қарыз ақша — сыйлық та, қосымша табыс та емес: оны қайтару міндеті бар. Кредитті бағалағанда қажеттілікті, тұрақты табысты және төлемдерге жеткілікті қалдықты есептеу керек.","240 000 ₸ тұратын ноутбукты 12 тең төлеммен, қосымша төлемсіз алсаң, айына 240 000 ÷ 12 = 20 000 ₸ төленеді.","Қарыздың қолжетімді болуы оны міндетті түрде алу керек дегенді білдірмейді."],["Толық төлем және артық төлем","Жарнамадағы ай сайынғы сома бүкіл шығынды көрсетпеуі мүмкін. Қосымша міндетті төлемдерді, пайызды және комиссияны есептеу керек.","240 000 ₸ тауарға міндетті 12 000 ₸ қосымша төлем қосылса, толық төлем 252 000 ₸. Ал 12 ай бойы 18 000 ₸ төлесең, барлығы 216 000 ₸ болады.","Артық төлем = жалпы төлем − бастапқы қарыз немесе тауардың негізгі бағасы (есеп шартына қарай)."],["Борыш жүктемесі деген не","Борыш жүктемесі табыстың қандай бөлігі қарыз төлемдеріне жұмсалатынын көрсетеді. Ол басқа міндетті шығындармен бірге бағалануы тиіс.","Айлық табыс 400 000 ₸, қарыз төлемдері 80 000 ₸ болса, үлесі 80 000 ÷ 400 000 × 100% = 20%.","Төлем мөлшері табысқа шаққанда қолжетімді көрінсе де, басқа қажетті шығындарды ескер."],["Кешігу және күмәнді ұсыныстар","Мерзімінен кеш төлеу қосымша шығындарға және басқа салдарға әкелуі мүмкін. «Кредитті бірден жауып береміз» деген белгісіз адамдарға ақша не құпия деректерді беруге болмайды.","Міндетті шығындардан кейін 30 000 ₸ қалса, ал кредит төлемі 35 000 ₸ болса, 5 000 ₸ жетіспейді.","Мәселе туындаса, банкпен ресми байланыс арналары арқылы хабарлас."]],"quiz":[["Тауар 80 000 ₸, келісімшарт бойынша 92 000 ₸ төленеді. Артық төлем қанша?",["8 000 ₸","10 000 ₸","12 000 ₸","22 000 ₸"],2,"92 000 − 80 000 = 12 000 ₸."],["Кредит шартын жасамай тұрып нені тексеру керек?",["Жарнама ұранын ғана","Бірінші төлемді ғана","Толық құны мен төлем кестесін","Тауардың танымалдығын"],2,"Толық құн барлық төлемнің қаржылық салмағын көрсетеді."],["Кредит ақшасы дегеніміз не?",["Қайтарылмайтын сыйлық","Қайтаруға міндетті ақша","Міндеттемесіз табыс","Пайызды депозит"],1,"Кредит келісімшарт бойынша қайтарылуға тиіс."],["Ноутбук 240 000 ₸, қосымша төлемсіз 12 бірдей төлем. Ай сайын қанша?",["15 000 ₸","18 000 ₸","20 000 ₸","24 000 ₸"],2,"240 000 ÷ 12 = 20 000 ₸."],["240 000 ₸ тауарға міндетті 12 000 ₸ төлем қосылды. Барлығы қанша?",["240 000 ₸","242 000 ₸","250 000 ₸","252 000 ₸"],3,"240 000 + 12 000 = 252 000 ₸."],["12 ай бойы айына 18 000 ₸ төленсе, жалпы төлем қанша?",["180 000 ₸","198 000 ₸","216 000 ₸","226 000 ₸"],2,"18 000 × 12 = 216 000 ₸."],["Тауар бағасы 180 000 ₸, барлық төлем 216 000 ₸. Айырма қанша?",["18 000 ₸","30 000 ₸","36 000 ₸","42 000 ₸"],2,"216 000 − 180 000 = 36 000 ₸."],["Табыс 400 000 ₸, қарыз төлемі 80 000 ₸. Табыстың қанша пайызы кетеді?",["10%","15%","20%","25%"],2,"80 000 ÷ 400 000 × 100% = 20%."],["Бөліп төлеу туралы қайсысы дұрыс?",["Онда ешқашан қосымша шығын болмайды","Толық сома мен шарттарды келісімшарттан тексеру қажет","Құны әрдайым нөл","Бюджетке енгізудің қажеті жоқ"],1,"Өнімнің атауы оның барлық шығынын тексеруді алмастырмайды."],["Міндетті шығындардан кейін 30 000 ₸ қалды, төлем 35 000 ₸. Қанша жетіспейді?",["3 000 ₸","4 000 ₸","5 000 ₸","6 000 ₸"],2,"35 000 − 30 000 = 5 000 ₸. Қолдағы қалдық төлемге жетпейді."]]},"reserve":{"title":"Қаржылық қауіпсіздік қоры","intro":"Қаржылық қауіпсіздік қоры — күтпеген қажетті шығынға немесе табыс уақытша азайғанда пайдаланылатын ақша қоры. Оның көлемі отбасы жағдайына тәуелді.","points":["Резервті күнделікті сатып алуға арналған ақшадан бөлек сақта.","Алдымен бір айдағы қажетті шығындарды есепте.","Қорды біртіндеп жинап, қаражатқа қауіпсіз әрі жылдам қол жеткізу жолын таңда."],"example":"Қажетті шығын айына 150 000 ₸ болса, екі айға арналған резерв 300 000 ₸. Бұл — есептеу мысалы, бәріне ортақ талап емес.","sections":[["Резерв пен мақсатқа арналған жинақ","Күтпеген жағдай қоры мен демалыс, телефон не сыйлық үшін жиналған ақша әртүрлі мақсатқа арналған. Екеуін бөлек есепке алу қаржылық шешімді жеңілдетеді.","Күтпеген жағдай қоры 180 000 ₸, демалысқа жинақ 60 000 ₸ болса, резервтің өзі 180 000 ₸; жалпы жинақ 240 000 ₸.","Мақсатқа жинақты күтпеген жағдай қорымен шатастырма."],["Резерв қанша айға жетеді","Қор жеткіліктілігін аймен өлшеуге болады: резерв сомасын бір айдағы міндетті шығынға бөл. Шығын өскенде қордың жеткіліктілік мерзімі қысқарады.","Резерв 360 000 ₸, айлық қажетті шығын 120 000 ₸ болса, 3 айға жетеді. Шығын 150 000 ₸-ге өссе, 360 000 ÷ 150 000 = 2,4 ай.","Резерв мөлшерін бағалау үшін шығынның өзгеруін де ескер."],["Айына қанша жинау керек","Нақты мақсат сомасынан қазір жиналған ақшаны алып таста. Қалған соманы ай сайын салуға болатын ақшаға бөл. Мерзім ыңғайсыз болса, жоспарды өзгертуге болады.","Резерв мақсаты — 240 000 ₸, қазір 60 000 ₸ бар. Тағы 180 000 ₸ қажет. Айына 15 000 ₸ жинасаң, 180 000 ÷ 15 000 = 12 ай кетеді (пайызсыз).","Аз сомадан тұрақты жинаудың өзі пайдалы әдет."],["Қолжетімділік және қауіпсіздік","Төтенше жағдайда ақша дер кезінде қолжетімді болуы маңызды. Сондықтан резервті тек жоғары тәуекелді активте сақтау оның мақсатына сай келмеуі мүмкін.","50 000 ₸ резервтен қажетті жөндеуге 45 000 ₸ жұмсалса, 5 000 ₸ қалады. Кейін қорды қайта толықтыру жоспарын жасауға болады.","Резервтің басты міндеті — тез байыту емес, күтпеген шығынға дайын болу."]],"quiz":[["Қаржылық қауіпсіздік қоры ең алдымен не үшін керек?",["Қымбат затты ойланбай алу үшін","Күтпеген қажетті шығындар үшін","Лотереяға қатысу үшін","Күнделікті ойын-сауық үшін"],1,"Резерв күтпеген қажетті шығын кезінде қаржылық тұрақтылыққа көмектеседі."],["Айлық міндетті шығын 100 000 ₸. Үш айлық резерв қанша?",["100 000 ₸","200 000 ₸","300 000 ₸","400 000 ₸"],2,"100 000 × 3 = 300 000 ₸."],["Резервке қалай қараған дұрыс?",["Кез келген қалауға жұмсалатын ақша","Бөлек сақталатын қор","Кепілді пайда","Басқа адамның қарызы"],1,"Бөлек қорды күнделікті қалауларға жұмсамау оңайырақ."],["Резерв 180 000 ₸, демалысқа бөлек 60 000 ₸ жиналған. Резервтің өзі қанша?",["60 000 ₸","120 000 ₸","180 000 ₸","240 000 ₸"],2,"Демалыс ақшасы бөлек есептеледі; резерв 180 000 ₸."],["Резерв 360 000 ₸, айлық шығын 120 000 ₸. Қанша айға жетеді?",["2","3","4","5"],1,"360 000 ÷ 120 000 = 3 ай."],["Резерв 360 000 ₸, айлық шығын 150 000 ₸ болды. Қанша айға жетеді?",["2 месяца","2,4 месяца","3 месяца","3,6 месяца"],1,"360 000 ÷ 150 000 = 2,4 ай."],["Резерв мақсаты 240 000 ₸, 60 000 ₸ бар. Тағы қанша жинау керек?",["120 000 ₸","150 000 ₸","180 000 ₸","200 000 ₸"],2,"240 000 − 60 000 = 180 000 ₸."],["180 000 ₸ жинау қалды, ай сайын 15 000 ₸ салынады, пайыз жоқ. Неше ай керек?",["10","11","12","13"],2,"180 000 ÷ 15 000 = 12 ай."],["Төтенше жағдай ақшасын сақтағанда ең маңыздысы не?",["Қажетті соманы тез әрі қауіпсіз алу мүмкіндігі","Пайда үшін барынша тәуекел ету","Өз ақшаңа қол жеткізуді қиындату","Жарнаманың танымалдығы"],0,"Күтпеген шығынға ақша қауіпсіз әрі қолжетімді болуы керек."],["50 000 ₸ резервтен жөндеуге 45 000 ₸ жұмсалды. Қанша қалды?",["2 500 ₸","5 000 ₸","10 000 ₸","15 000 ₸"],1,"50 000 − 45 000 = 5 000 ₸."]]},"invest":{"title":"Акциялар және облигациялар","intro":"Акция көбіне компаниядағы үлесті, ал облигация эмитенттің қарыз міндеттемесін білдіреді. Инвестиция табыс әкелуі мүмкін, бірақ шығын қаупі де бар.","points":["Акция бағасы өсуі де, төмендеуі де мүмкін; дивидендке кепілдік жоқ.","Облигация купон төлей алады, бірақ эмитент төлемеуі және бағасы өзгеруі мүмкін.","Түрлі активтерге бөлу жекелеген тәуекелді азайтуы мүмкін, бірақ шығынды толық жоймайды."],"example":"Әрқайсысы 5 000 ₸ тұратын 2 акция алсаң, 10 000 ₸ жұмсайсың. Баға 4 500 ₸-ге түссе, олардың нарықтық құны 9 000 ₸ болады.","sections":[["Инвестор нені сатып алады","Акция сатып алғанда компанияның үлесін, ал облигация алғанда қарыз талап ету құқығын иеленесің. Құқықтар мен төлем шарттары нақты құралдың құжаттарына байланысты.","6 акцияның әрқайсысы 8 000 ₸ болса, комиссиясыз сатып алу сомасы 6 × 8 000 = 48 000 ₸.","Бағалы қағаздың атауын ғана емес, оның қандай құқық беретінін біл."],["Акциядан түсетін табыс пен шығын","Акцияның бағасы нарықта өзгеріп тұрады. Баға өссе де, сатпайынша пайда жүзеге аспаған болуы мүмкін. Дивиденд бөлек табыс, бірақ кепілдендірілмейді.","4 акцияны 10 000 ₸-ден алдың. Баға 11 500 ₸ болды. Құн өсімі: 4 × (11 500 − 10 000) = 6 000 ₸. Бір акция өсімі: 1 500 ÷ 10 000 × 100% = 15%.","Пайданы есептегенде комиссиялар мен шығындарды да ескер."],["Облигация купоны және тәуекелі","Облигацияның номиналы мен купондық мөлшерлемесі төлемді есептеуге көмектеседі. Бірақ эмитенттің төлем қабілеті және нарықтағы бағаның өзгеруі маңызды тәуекел болып қала береді.","Номиналы 20 000 ₸, жылдық купоны 8% облигацияның бір жылдық шартты купоны: 20 000 × 0,08 = 1 600 ₸ (эмитент толық төлесе).","Купон төлемі де абсолютті кепіл емес."],["Портфельді бөлу және тәуекел","Әртүрлі компания, сала және актив түріне ақша бөлу бір көзге тәуелділікті азайтады. Бірақ жалпы нарық құлдыраса, бірнеше актив бірге арзандауы мүмкін.","300 000 ₸ портфельдің 60 000 ₸-і қолма-қол ақша болса, оның үлесі 20%. 120 000 ₸ актив 25%-ға арзандап, өзге 180 000 ₸ өзгермесе, портфель 120 000 × 0,75 + 180 000 = 270 000 ₸ болады.","Әртараптандыру барлық тәуекелді жоя алмайды."]],"quiz":[["Акцияға ие болу көбіне нені білдіреді?",["Компаниядағы үлес","Кепілді пайда","Тегін кредит","Белгіленген жалақы"],0,"Акция әдетте компанияға қатысу үлесін білдіреді."],["Облигация купоны деген не?",["Дүкен комиссиясы","Облигация шартына сай пайыздық төлем","Акция бағасы","Салық айыппұлы"],1,"Купон — облигация шартындағы төлем."],["Инвестиция туралы қай тұжырым дұрыс?",["Баға ешқашан түспейді","Пайда әрдайым кепілді","Шығын болуы мүмкін","Барлық активтің тәуекелі бірдей"],2,"Актив арзандауы мүмкін, эмитент міндеттемесін орындамауы ықтимал."],["6 акцияның әрқайсысы 8 000 ₸. Комиссиясыз сатып алу құны қанша?",["42 000 ₸","46 000 ₸","48 000 ₸","54 000 ₸"],2,"6 × 8 000 = 48 000 ₸."],["4 акция 10 000 ₸-ден алынды, баға 11 500 ₸ болды. Комиссиясыз құн өсімі қанша?",["4 000 ₸","5 000 ₸","6 000 ₸","8 000 ₸"],2,"4 × (11 500 − 10 000) = 6 000 ₸."],["Баға 10 000 ₸-ден 11 500 ₸-ге өсті. Өсім қанша пайыз?",["10%","12%","15%","20%"],2,"(11 500 − 10 000) ÷ 10 000 × 100% = 15%."],["Облигация номиналы 20 000 ₸, жылдық купон 8%. Бір қағаздың жылдық төлемі қанша?",["800 ₸","1 200 ₸","1 600 ₸","2 000 ₸"],2,"20 000 × 0,08 = 1 600 ₸, егер эмитент шарттағы төлемді толық орындаса."],["Портфельде 300 000 ₸, оның 60 000 ₸-і ақша. Ақша үлесі қанша?",["10%","15%","20%","25%"],2,"60 000 ÷ 300 000 × 100% = 20%."],["120 000 ₸ актив 25% арзандады, ал портфельдегі өзге 180 000 ₸ өзгермеді. Нәтиже қанша?",["240 000 ₸","250 000 ₸","270 000 ₸","290 000 ₸"],2,"120 000 × 0,75 + 180 000 = 270 000 ₸."],["Әртараптандыруды қай тұжырым дәл сипаттайды?",["Шығыннан толық қорғау","Бір эмитентті ғана алу","Ақшаны әртүрлі активтер мен тәуекелдерге бөлу","Табыстылықтың кепілді өсімі"],2,"Әртараптандыру бір позицияға тәуелділікті азайтады, бірақ барлық тәуекелді жоймайды."]]},"pension":{"title":"Болашаққа арналған жинақ","intro":"Ұзақ мерзімді қаржылық жоспар ірі мақсаттарға және болашақ шығындарға дайындалуға көмектеседі. Зейнетақы жинақтары — соның бір мысалы.","points":["Жоспарды ерте бастау тұрақты жинауға көбірек уақыт береді.","Инфляция жиналған ақшаның сатып алу қабілетіне әсер етеді.","Зейнетақыға қатысты нақты ережелер қолданыстағы заңнамаға байланысты."],"example":"Айына 5 000 ₸ жинасаң, табыстылықты есептемегенде, бір жылда 5 000 × 12 = 60 000 ₸ жиналады.","sections":[["Ұзақ мерзімді мақсат және жүйелілік","Үлкен мақсатқа жету үшін қажетті соманы, мерзімді және тұрақты салымды анықта. Табысың немесе шығының өзгерсе, жоспарды қайта қара.","Айына 7 500 ₸ жинасаң, 12 айда 90 000 ₸, ал 24 айда 180 000 ₸ жиналады (пайызсыз).","Жоспарды мерзімді түрде жаңарту — қалыпты қаржылық дағды."],["Инфляция нені өзгертеді","Инфляция — баға деңгейінің жалпы өсуі. Бағалар көтерілгенде бірдей ақшаға азырақ тауар мен қызмет сатып алуға болады.","Тауар себеті 40 000 ₸ болып, кейін 44 000 ₸ болса, қымбаттау 4 000 ÷ 40 000 × 100% = 10%.","Жинақ сомасын ғана емес, оның сатып алу қабілетін де бағала."],["Номиналды сома мен сатып алу қабілеті","Шоттағы ақша саны көбейсе де, қажетті тауар одан жылдам қымбаттаса, нақты сатып алу мүмкіндігі төмендеуі мүмкін.","Жинағың 108 000 ₸-ге жетті, ал қажетті себет 112 000 ₸ тұрса, 4 000 ₸ жетіспейді.","«Ақшам көбейді» деген әрдайым «көбірек тауар аламын» деген сөз емес."],["Қазақстанның зейнетақы жүйесі: негізі","Қазақстанда зейнетақы жинақтау жүйесіне Бірыңғай жинақтаушы зейнетақы қоры (БЖЗҚ) қатысады. Жарналар, төлемдер және басқа талаптар заңмен реттеледі. Оқушыға нақты жеке зейнетақы деректерін енгізудің қажеті жоқ.","Егер адам жылына 60 000 ₸ жинауды мақсат етсе, ай сайынғы шартты жарна 60 000 ÷ 12 = 5 000 ₸ болар еді. Бұл нақты міндетті зейнетақы жарнасын есептеу емес.","Нақты ережелерді БЖЗҚ мен мемлекеттік органдардың ресми ақпаратынан тексер."]],"quiz":[["Айына 5 000 ₸ жинасаң, пайызсыз бір жылда қанша болады?",["30 000 ₸","50 000 ₸","60 000 ₸","75 000 ₸"],2,"5 000 × 12 = 60 000 ₸."],["Ақшаның сатып алу қабілетін не төмендетуі мүмкін?",["Жоспарлау","Инфляция","Шығынды жазу","Қаржылық мақсат"],1,"Баға өскенде бір сомаға азырақ тауар алуға болады."],["Ұзақ мерзімді жоспарға не көмектеседі?",["Мақсатты үнемі қайта қарау","Мерзімді елемеу","Шығынды есептемеу","Кепілді пайданы күту"],0,"Жоспарды қайта қарау жаңа жағдайды ескеруге көмектеседі."],["24 ай бойы айына 7 500 ₸ жинасаң, пайызсыз қанша жиналады?",["150 000 ₸","165 000 ₸","180 000 ₸","195 000 ₸"],2,"7 500 × 24 = 180 000 ₸."],["12 ай бойы айына 7 500 ₸ жинасаң, пайызсыз қанша жиналады?",["75 000 ₸","90 000 ₸","105 000 ₸","120 000 ₸"],1,"7 500 × 12 = 90 000 ₸."],["Тауар себеті 40 000 ₸-ден 44 000 ₸-ге қымбаттады. Өсім қанша пайыз?",["5%","8%","10%","12%"],2,"4 000 ÷ 40 000 × 100% = 10%."],["Тауар себеті 44 000 ₸ тұрады, қолда 40 000 ₸. Қанша жетпейді?",["2 000 ₸","3 000 ₸","4 000 ₸","5 000 ₸"],2,"44 000 − 40 000 = 4 000 ₸."],["Жинақ 108 000 ₸ болды, қажетті себет 112 000 ₸ тұрады. Нәтиже қандай?",["Ақша жетеді, 4 000 ₸ қалады","4 000 ₸ жетпейді","Ақша дәл жетеді","8 000 ₸ жетпейді"],1,"112 000 − 108 000 = 4 000 ₸ жетпейді."],["«Жинақтың номиналды сомасы» нені білдіреді?",["Ақшалай өлшемдегі соманы","Ескі бағамен тауар санын","Кепілді нақты табысты","Инфляция мөлшерін"],0,"Номиналды сома бағалардың өзгеруіне автоматты түрде түзетілмейді."],["Қазақстанда БЖЗҚ қандай міндет атқарады?",["Барлық мектеп оқулығын сатады","Зейнетақы жинақтау жүйесіне қатысады","Кез келген акция өсіміне кепілдік береді","Дүкен бағасын белгілейді"],1,"БЖЗҚ зейнетақы жинақтау жүйесіне қатысады; ережелер заңмен реттеледі."]]},"scams":{"title":"Алаяқтық және қаржы пирамидалары","intro":"Алаяқтар тәуекелсіз өте жоғары табыс уәде етіп, шешімді тез қабылдатуға тырысуы және маңызды шарттарды жасыруы мүмкін. Қауіпсіздік ақпаратты тексеруден басталады.","points":["Құпиясөзді, бір реттік кодтарды және шотқа кіру деректерін ешкімге берме.","Тәуекелсіз кепілді жоғары кіріс туралы уәдеге сенбе.","Күмәнді ұсынысты ресми дереккөзден тексеріп, сенімді ересекпен ақылдас."],"example":"Бейтаныс адам «жүлдені алу үшін SMS кодын айт» десе, кодты беруге болмайды.","sections":[["Неге тез байыту уәдесі қауіпті","Бір аптада ақшаны бірнеше есе көбейту туралы уәде сенімді дәлел емес. Ұйымның нақты қызметін, лицензиясын, табыс көзін және тәуекелдерін тексер.","50 000 ₸ салып, бір айдан кейін 75 000 ₸ аласың десе, уәде етілген табыс (75 000 − 50 000) ÷ 50 000 × 100% = 50%. Бұл уәденің орындалатынын білдірмейді.","«Жоғары табыс, ешқандай тәуекел жоқ» деген сөз — қауіп белгісі."],["Алаяқ хабарламалар және жалған сайттар","Алаяқтар шұғыл әрекет етуге итермелеп, жалған сілтемелер мен SMS кодтары арқылы аккаунтқа қол жеткізуге тырысады. Банкке тек өзің тапқан ресми байланыс арқылы хабарлас.","«Кодты бір минут ішінде жібер!» деген хабарлама келсе, кодты жіберме және сілтемені ашпа.","Ешкімге бір реттік банк кодын айтуға болмайды."],["Күмәнді ұсынысты қалай тексеруге болады","Компанияның тіркелуі мен рұқсаттарын ресми тізілімдерден тексер. Құжаттарын оқы; тек сайт дизайнына, блогер жарнамасына немесе лайк санына сенбе. Алаяқтық пирамидаларда төлемдер көбіне жаңа қатысушылардың жарналарына тәуелді.","«Табыс табу үшін тағы үш адам әкел» деген шарт болса, ұйымның нақты өнімінен емес, қатысушылардан ақша келетін-келмейтінін анықтау керек.","Дәлелденбеген ұсынысқа ақша аударма."],["Қателескен жағдайда қауіпсіз әрекет","Күмәнді жобаға ақша жіберіп қойған адамды кінәлаудың қажеті жоқ. Қайта ақша салма, құпия деректерді берме, банкке және ресми органдарға хабарлас, сенімді ересектен көмек сұра. «Ақшаңды қайтарып береміз» деп алдын ала төлем сұрайтын бейтаныстарға сенбе.","20 000 ₸ жоғалтқан адамға біреу «5 000 ₸ төлесең, бәрін қайтарамын» десе, төлеме: бұл қайталама алаяқтық болуы мүмкін.","Көмекті тек ресми арналардан ізде."]],"quiz":[["Бейтаныс адам банктің SMS кодын сұраса, не істеу керек?",["Кодты бірден айту","Код суретін жіберу","Кодты ешкімге айтпау","Кодты жариялау"],2,"Бір реттік код аккаунтқа немесе операцияға қол жеткізуі мүмкін."],["Қай белгі күмән туғызуы тиіс?",["Келісімшарттың болуы","Тәуекелсіз кепілді өте жоғары табыс уәдесі","Тәуекелді түсіндіру","Компанияны тексеру мүмкіндігі"],1,"Тәуекелсіз өте жоғары табыс уәдесі — күмәнді белгі."],["Күмәнді сілтемемен не істеу керек?",["Құпиясөзді бірден енгізу","Достарға тарату","Мекенжайды ресми арна арқылы тексеру","Жеке құжатты жіберу"],2,"Ресми арна жалған бетті ажыратуға көмектеседі."],["Бір айда 50 000 ₸-ді 75 000 ₸-ге жеткіземіз дейді. Қанша пайыз пайда уәде етіледі?",["25%","40%","50%","75%"],2,"(75 000 − 50 000) ÷ 50 000 × 100% = 50%. Бірақ уәде ақшаның шын төленетінін білдірмейді."],["Қаржы пирамидасына көбіне не тән?",["Табыс көбіне жаңа қатысушылар тартудан түседі","Құжатпен расталған нақты өнім сату","Табыс уәдесінің болмауы","Реттеушінің тәуелсіз тексеруі"],0,"Пирамидада бұрынғы қатысушыларға төлем көбіне жаңалардың жарнасынан жасалады."],["«Банк кодын бір минут ішінде айт» деген SMS келді. Не істейсің?",["Асығыс болғандықтан кодты айту","Кодты таныстарға жіберу","Кездейсоқ сілтемені ашу","Кодты бермей, ресми арна арқылы тексеру"],3,"Кодты ешкімге айтпа, банкке өзің тапқан ресми арна арқылы хабарлас."],["Неге әдемі сайт қаржы ұйымының сенімділігін дәлелдемейді?",["Өйткені заңды қызметсіз де әдемі сайт жасауға болады","Өйткені барлық сайтқа тыйым салынған","Өйткені сайтта мәтін болмайды","Өйткені қағаз әрқашан пайдаға кепілдік береді"],0,"Сыртқы көрініс ұйымның заңдылығын дәлелдемейді."],["Ақша табу ұсынысында не күмән туғызуы тиіс?",["Түсінікті шарт","Тәуекел туралы ақпарат","Төлем алу үшін жаңа салымшыларды тарту талабы","Компания туралы ресми ақпарат"],2,"Жаңа адамдар тартуға тәуелді табыс — қауіп белгісі."],["Бейтаныс адам жоғалған 20 000 ₸-ді қайтару үшін 5 000 ₸ алдын ала төлем сұрайды. Қауіпсіз әрекет қандай?",["Алдын ала ақшаны жіберу","Төлемей, ресми органдарға жүгіну","Жеделдету үшін құпиясөзді беру","Досыңнан төлеуді сұрау"],1,"Ақшаны қайтаруды уәде еткен бейтаныс адам да алаяқ болуы мүмкін."],["Қазақстанда қаржылық ұсынысты қалай дұрыс тексеруге болады?",["Лайк санына қарап","Блогер уәдесіне қарап","Чаттағы жауап жылдамдығына қарап","Ресми дерек пен құжатты қарап, ересекпен талқылау"],3,"Ресми тізілім мен шарттар жарнама уәдесінен сенімдірек."]]},"digital":{"title":"Цифрлық төлемдер және криптоактивтер","intro":"Цифрлық төлем жасау ыңғайлы, бірақ деректерді қорғауды талап етеді. Криптоактивтер бағасы күрт өзгеруі мүмкін жоғары тәуекелді активтерге жатады.","points":["Аударымды растаудан бұрын алушыны және соманы тексер.","Құрылғыңды құпиясөзбен қорғап, қауіпсіз кіру тәсілін пайдалан.","Криптоактивті депозитпен шатастырма: олардың қорғалу ережелері мен құн кепілдігі бірдей емес."],"example":"Оқу мысалында цифрлық актив 10 000 ₸-ден 7 000 ₸-ге арзандаса, төмендеу (3 000 ÷ 10 000) × 100% = 30%.","sections":[["Электрондық төлем: деректемелерді тексеру","Аударымды растаудан бұрын алушының атын, соманы және төлем мақсатын тексер. Операцияны қайтару шарттары қызметке қарай өзгереді. Оқу платформасына нақты төлем реквизиттерін енгізбе.","12 500 ₸ жіберу керек еді, бірақ 125 000 ₸ жазылды. Қате: 125 000 − 12 500 = 112 500 ₸; енгізілген сома жоспарланғаннан 10 есе көп.","Растау түймесін басар алдында деректерді қайта тексер."],["Құпиясөздер, құрылғылар және кіру","Әр сервиске бөлек, күрделі құпиясөз қолдану пайдалы. Қосымша растау қауіпсіздікті арттырғанымен, бір реттік кодтарды да құпия сақтау қажет. Күмәнді QR кодтардан және ортақ құрылғылардан сақ бол.","Бір құпиясөз бес сервисте қолданылса, ол әшкереленгенде бес аккаунтқа да қауіп төнуі мүмкін. Бөлек құпиясөз тәуекелді шектейді.","Аккаунт қауіпсіздігі бірнеше дағдыға сүйенеді."],["Криптоактивтердің құбылмалылығы және шектеулері","Криптоактив бағасы тез өсуі де, құлдырауы да мүмкін. Оның құқықтық режимі банк депозитінен өзгеше; депозиттерге кепілдік криптоактивтің бағасын қорғамайды. Оқушылар үшін нақты криптоактив сатып алмай, тек оқу есебін қолданамыз.","Актив 40 000 ₸-ден 50 000 ₸-ге өссе, өсім 25%; кейін 30 000 ₸-ге түссе, 50 000 ₸-ден төмендеу 40%. Ал бастапқы бағадан айырмасы −25%.","Пайыздық өзгерісті қай бастапқы сомадан есептегеніңді ұмытпа."],["Комиссияны не үшін есептеу керек","Комиссия аударымның немесе сатып алудың нақты құнын арттырады. Тарифті растаудан бұрын тексер; оқу мысалындағы комиссия нақты банктің қолданыстағы бағасы емес.","30 000 ₸ аударымға шартты 450 ₸ комиссия қосылды. Барлығы 30 450 ₸ алынады. Комиссия үлесі 450 ÷ 30 000 × 100% = 1,5%.","Тариф пен толық шығынды алдын ала есепте."]],"quiz":[["Ақша аудармас бұрын нені тексеру керек?",["Алушы мен соманы","Қосымша фонын ғана","Кездейсоқ жарнаманы","Жазылушылар санын"],0,"Алушы мен соманы тексеру қателесуді азайтады."],["Актив 10 000 ₸-ден 7 000 ₸-ге түсті. Қанша пайыз арзандады?",["10%","20%","30%","40%"],2,"Бағаның 3 000 ₸-ге төмендеуі бастапқы 10 000 ₸-нің 30%-ын құрайды."],["Криптоактивтер туралы қайсысы дұрыс?",["Бағасы әрдайым тұрақты","Пайдаға кепілдік береді","Бағасы күрт өзгеруі мүмкін","Резервті толығымен алмастырады"],2,"Криптоактивтер бағасы қатты құбылуы мүмкін."],["12 500 ₸ аудармақ болды, бірақ 125 000 ₸ жазды. Айырмасы қанша?",["100 000 ₸","110 000 ₸","112 500 ₸","125 000 ₸"],2,"125 000 − 12 500 = 112 500 ₸."],["Бірнеше онлайн аккаунтты қалай жақсырақ қорғауға болады?",["Бәріне ортақ бір құпиясөз қолдану","Әр сервиске бөлек құпиясөз қолдану","Құпиясөзді таныстарға айту","Құпиясөзді жария пікірге жазу"],1,"Бөлек құпиясөз бір аккаунттағы мәселенің басқаларына таралу қаупін азайтады."],["Оқу активі 40 000 ₸-ден 50 000 ₸-ге өсті. Өсім қанша пайыз?",["10%","20%","25%","30%"],2,"10 000 ÷ 40 000 × 100% = 25%."],["Актив 50 000 ₸-ден 30 000 ₸-ге түсті. 50 000 ₸-ге шаққанда қанша пайыз төмендеді?",["25%","30%","35%","40%"],3,"20 000 ÷ 50 000 × 100% = 40%."],["Аударым 30 000 ₸, комиссия 450 ₸. Жалпы қанша алынады?",["30 000 ₸","30 450 ₸","31 500 ₸","34 500 ₸"],1,"30 000 + 450 = 30 450 ₸."],["30 000 ₸ аударымның 450 ₸ комиссиясы қанша пайыз?",["0,5%","1%","1,5%","2%"],2,"450 ÷ 30 000 × 100% = 1,5%."],["Криптоактив пен банктік депозитті салыстырғанда қай тұжырым дұрыс?",["Оларға ҚДКҚ дәл сондай кепілдік береді","Нарықтық бағасына кепілдік бар","Бағасы өзгермейді","Олар банк депозитіне берілетін кепілдікпен қорғалмайды"],3,"ҚДКҚ белгілі банк салымдарын белгіленген шекте қорғайды, криптоактив бағасын емес."]]}};
